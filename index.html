<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2A4A">
<title>Hamariff · Chấm thi bằng điện thoại</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B2A4A; --navy-2: #131E36; --pink: #D81B60; --pink-d: #AD1457; --pink-s: #FCE4EE;
  --bg: #F4F6FA; --card: #FFFFFF; --line: #E3E6EC; --text: #1F2937; --muted: #6B7280;
  --ok: #2E7D32; --ok-s: #E8F5E9; --bad: #D32F2F; --bad-s: #FFEBEE; --warn: #B26A00; --warn-b: #F9A825; --warn-s: #FFF8E1;
  --info: #1565C0; --info-s: #E3F2FD; --r: 14px; --shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 2px 8px rgba(17, 24, 39, .05);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* ---------- khung */
.top { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; padding: 12px 16px 12px; display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--pink); display: grid; place-items: center; flex: none; }
.logo svg { width: 20px; height: 20px; }
.top h1 { font-size: 16px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: .1px; }
.top .sub { font-size: 12px; opacity: .72; margin-top: 1px; }
.top .sync { margin-left: auto; font-size: 11.5px; padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .12); white-space: nowrap; }
main { max-width: 620px; margin: 0 auto; padding: 14px 14px calc(96px + env(safe-area-inset-bottom)); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.tabs .in { display: flex; width: 100%; max-width: 620px; }
.tab { flex: 1; border: 0; background: none; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; position: relative; }
.tab svg { width: 23px; height: 23px; }
.tab.on { color: var(--pink); }
.tab.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--pink); }
.tab .badge { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

/* ---------- thẻ */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 15.5px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.card h2 .step { width: 24px; height: 24px; border-radius: 50%; background: var(--pink-s); color: var(--pink-d); font-size: 13px; display: grid; place-items: center; flex: none; }
.card .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mt { margin-top: 12px; }
.mt-s { margin-top: 8px; }

/* ---------- nút */
.btn { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; text-decoration: none; color: var(--text); }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
.btn.primary:active { background: var(--pink-d); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.danger { color: var(--bad); border-color: #F4C7C7; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 8px 10px; min-height: 36px; }
.btn.block { width: 100%; }
.btn.big { min-height: 64px; font-size: 17px; border-radius: 16px; }
.btn.big svg { width: 26px; height: 26px; }
label.btn input[type=file] { display: none; }

/* ---------- ô nhập */
.field { display: block; margin-bottom: 10px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px; }
.field small { color: var(--muted); font-weight: 400; }
.input, textarea.input, select.input { width: 100%; border: 1px solid #D5D9E1; border-radius: 10px; padding: 10px 12px; background: #fff; min-height: 44px; }
textarea.input { min-height: 64px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14.5px; letter-spacing: .5px; }
.input:focus { outline: 2px solid rgba(216, 27, 96, .25); border-color: var(--pink); }
.seg { display: flex; border: 1px solid #D5D9E1; border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: #fff; padding: 10px 8px; font-weight: 600; font-size: 13.5px; cursor: pointer; min-height: 44px; }
.seg button + button { border-left: 1px solid #D5D9E1; }
.seg button.on { background: var(--pink-s); color: var(--pink-d); }

/* ---------- danh sách mã đề */
.codes { display: grid; gap: 8px; }
.code { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; }
.code > svg { width: 26px; height: 26px; flex: none; color: var(--pink); }
.code b { font-size: 16px; font-variant-numeric: tabular-nums; min-width: 52px; }
.code .grow { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; background: #EEF1F6; color: #374151; }
.chip.ok { background: var(--ok-s); color: var(--ok); }
.chip.bad { background: var(--bad-s); color: var(--bad); }
.chip.warn { background: var(--warn-s); color: var(--warn); }
.chip.info { background: var(--info-s); color: var(--info); }
.chip.pink { background: var(--pink-s); color: var(--pink-d); }

/* ---------- thông báo */
.notice { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin: 10px 0; display: flex; gap: 9px; align-items: flex-start; }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.notice ul { margin: 4px 0 0; padding-left: 18px; }
.notice.ok { background: var(--ok-s); color: #1B5E20; }
.notice.bad { background: var(--bad-s); color: #B71C1C; }
.notice.warn { background: var(--warn-s); color: #7A4F01; }
.notice.info { background: var(--info-s); color: #0D47A1; }

/* ---------- chấm bài */
.capture { display: grid; gap: 10px; }
.tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.tip { background: #F8F9FC; border: 1px solid var(--line); border-radius: 12px; padding: 9px 8px; font-size: 12px; color: #4B5563; text-align: center; }
.tip svg { width: 22px; height: 22px; display: block; margin: 0 auto 4px; color: var(--navy); }
.busy { display: flex; align-items: center; gap: 12px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--pink-s); border-top-color: var(--pink); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.score { display: flex; align-items: center; gap: 14px; }
.score .big { font-size: 44px; line-height: 1; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: -1px; }
.score .big small { font-size: 18px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.score .meta { flex: 1; min-width: 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.sheet-img { margin-top: 12px; border-radius: 12px; border: 1px solid var(--line); overflow: auto; max-height: 75vh; background: #fff; -webkit-overflow-scrolling: touch; }
.sheet-img img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.sheet-img.zoom img { width: 230%; max-width: none; cursor: zoom-out; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: #4B5563; margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.ring { background: transparent; border: 2.5px solid #2E7D32; }
.legend i.sq { border-radius: 3px; }
.batch { display: grid; gap: 6px; margin-top: 10px; }
.batch button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.batch button svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.batch button .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.batch button.sel { border-color: var(--pink); background: #FFF7FA; }

/* ---------- kết quả */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: #F8F9FC; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 22px; color: var(--navy); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 6px; border-bottom: 1px solid var(--line); }
table.list td { padding: 10px 6px; border-bottom: 1px solid #EEF0F4; font-variant-numeric: tabular-nums; }
table.list tr.click { cursor: pointer; }
table.list tr.click:active td { background: #FFF7FA; }
table.list td.num { text-align: right; font-weight: 700; }
table.q { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
table.q th, table.q td { padding: 6px 6px; border-bottom: 1px solid #EEF0F4; text-align: left; }
table.q th { font-size: 12px; color: var(--muted); }
.o-correct { color: var(--ok); font-weight: 700; }
.o-incorrect, .o-blank { color: var(--bad); font-weight: 700; }
.o-partial { color: #E65100; font-weight: 700; }
.o-multiple, .o-invalid { color: var(--warn); font-weight: 700; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
.empty svg { width: 44px; height: 44px; color: #C3C8D2; display: block; margin: 0 auto 8px; }

/* ---------- hộp thoại */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, .45); display: flex; align-items: flex-end; justify-content: center; }
.modal .box { background: #fff; width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
.modal .box h3 { margin: 0 0 6px; font-size: 17px; }
.modal .grab { width: 40px; height: 4px; border-radius: 2px; background: #D5D9E1; margin: 0 auto 12px; }
@media (min-width: 700px) { .modal { align-items: center; } .modal .box { border-radius: 18px; } }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--navy-2); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); max-width: 92vw; }
details.more summary { cursor: pointer; color: var(--pink-d); font-weight: 600; font-size: 14px; padding: 6px 0; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "＋ "; }
details.more[open] summary::before { content: "－ "; }

/* ---------- camera tự chụp */
.live { position: fixed; inset: 0; z-index: 90; background: #000; color: #fff; overflow: hidden; touch-action: manipulation; user-select: none; }
.live video, .live canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.live video { object-fit: cover; }
.live .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .18s; }
.live .flash.on { opacity: .75; transition: none; }
.live .bar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 8px 12px 14px; min-height: 64px; background: linear-gradient(rgba(0,0,0,.6), transparent); }
.live .x { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 18px; cursor: pointer; flex: none; }
.live .title { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.live .title span { font-size: 12px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live .count { margin-left: auto; background: rgba(216,27,96,.9); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.live .msg { position: absolute; left: 0; right: 0; bottom: calc(112px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
.live .hint { font-weight: 700; font-size: 15px; text-align: center; padding: 8px 14px; border-radius: 12px; background: rgba(0,0,0,.45); max-width: 94%; }
.live .hint.ok { background: rgba(46,125,50,.9); }
.live .hint.bad { background: rgba(198,40,40,.9); }
.live .rot { font-size: 12.5px; background: rgba(255,255,255,.16); border-radius: 10px; padding: 5px 10px; }
.live .controls { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-around; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.7)); }
@media (orientation: landscape) {
  .live .controls { left: auto; top: 0; width: 104px; flex-direction: column; justify-content: center; gap: 22px; padding: 12px calc(12px + env(safe-area-inset-right)) 12px 12px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.65) 35%); }
  .live .msg { bottom: 8px; right: 104px; }
  .live .bar { right: 104px; min-height: 52px; padding-top: 6px; }
  .live .hint { font-size: 13.5px; padding: 6px 12px; }
}
.live .side { width: 54px; height: 54px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; cursor: pointer; }
.live .side svg { width: 24px; height: 24px; }
.live .side.on { background: #FDD835; color: #000; }
.live .side.hidden { visibility: hidden; display: grid !important; }
.live .done { font-weight: 700; font-size: 14px; }
.live .shutter { width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.12); display: grid; place-items: center; cursor: pointer; padding: 0; }
.live .shutter .ring { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.85); transform: scale(.35); transition: transform .12s linear, background .12s; }
.live .shutter .ring.full { background: #4ADE80; }
.live .res { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; background: #fff; color: var(--text); border: 0; border-radius: 14px; padding: 6px 10px; text-align: left; box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer; font: inherit; }
.live .res.warn { box-shadow: 0 0 0 3px #F9A825, 0 4px 14px rgba(0,0,0,.3); }
.live .res .grow { flex: 1; min-width: 0; line-height: 1.25; }
.live .res b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live .res .warnline, .live .res .okline { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live .res .warnline { color: #8A5A00; }
.live .res .okline { color: var(--muted); }
.live .score-s { font-size: 24px; font-weight: 800; color: var(--navy); line-height: 1; font-variant-numeric: tabular-nums; }

</style>
</head>

          const col = g * gs + j, cells = [];

        }

  function canvasSize(tpl, dpi) {

  }

  /** Tọa độ pixel của từng ô tròn và dấu định vị trên canvas chuẩn W×H. */

      const radius = Math.max(1.5, r.bubbleSizeRatio * Math.min(cw, ch) / 2);
      const groups = getGroups(r).map(g => ({
        kind: g.kind, part: g.part, q: g.q, pos: g.pos,
        cells: g.cells.map(c => { const [x, y] = cellCenter(r, c.row, c.col); return { row: c.row, col: c.col, label: c.label, x: x * W, y: y * Hh, r: radius }; })

  // ======================================================================= Xử lý ảnh cơ bản

  /** Thu nhỏ ảnh RGBA theo trung bình vùng (dùng khi không có canvas, vd kiểm thử Node). */

    for (let y = 0; y <= nh; y++) ys[y] = Math.min(h, Math.round(y * h / nh));
    const acc = new Float64Array(nw * 4);
    for (let ty = 0; ty < nh; ty++) {

  function blur5(src, w, h) {

  /** Ngưỡng thích nghi (trung bình khối − C), đảo: 1 = điểm tối. */

  /** Phép mở hình thái (co rồi giãn) với nhân vuông k×k trên ảnh nhị phân 0/1. */

  /** Gán nhãn thành phần liên thông (8 hướng) + thống kê. */

    const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };

    for (let i = 1; i < n; i++) { const r = find(i); if (r === i) id[i] = ++count; }

  /** Hình chữ nhật xoay nhỏ nhất bao các điểm ảnh của thành phần c (dò góc 0..88°, bước 2°). */

    const xs = [], ys = [];

      for (let x = cc.minx[c]; x <= cc.maxx[c]; x++)
        if (cc.labels[y * w + x] === c) { xs.push(x); ys.push(y); }

        if (u < u0) u0 = u; if (u > u1) u1 = u; if (v < v0) v0 = v; if (v > v1) v1 = v;
      }

  function otsu(hist) {

  // ======================================================================= Ma trận phối cảnh

  function solve(A, b) {
    const n = b.length;
    const M = A.map((row, i) => row.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-12) return null;

      for (let r = 0; r < n; r++) {
        if (r === c) continue;

        for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];

  /** Ma trận 3×3 (mảng 9 phần tử) đưa 4 điểm src về 4 điểm dst. */

  function normalizer(pts) {

  /** Bình phương tối thiểu (chuẩn hóa Hartley) cho ≥ 4 cặp điểm. */

  // ======================================================================= Kiểm tra chất lượng ảnh

  function assessQuality(gray, w, h, opt) {
    const warnings = [];
    if (Math.min(w, h) < opt.minImageSide)
      return { ok: false, error: `Ảnh quá nhỏ (${w}×${h}px). Cần cạnh ngắn ≥ ${opt.minImageSide}px.`, warnings };

    for (let i = 0; i < gray.length; i++) { s += gray[i]; s2 += gray[i] * gray[i]; }
    const mean = s / gray.length, std = Math.sqrt(Math.max(0, s2 / gray.length - mean * mean));

    if (mean < 45) warnings.push('Ảnh quá tối – nên chụp nơi đủ sáng.');
    if (mean > 245) warnings.push('Ảnh quá sáng/cháy sáng.');

    const sc = Math.min(1, 1000 / Math.max(w, h));
    const sw = Math.max(3, Math.round(w * sc)), sh = Math.max(3, Math.round(h * sc));
    const small = new Float32Array(sw * sh);
    for (let y = 0; y < sh; y++) {
      const y0 = Math.floor(y / sc), y1 = Math.max(y0 + 1, Math.min(h, Math.floor((y + 1) / sc)));
      for (let x = 0; x < sw; x++) {
        const x0 = Math.floor(x / sc), x1 = Math.max(x0 + 1, Math.min(w, Math.floor((x + 1) / sc)));

        for (let yy = y0; yy < y1; yy += Math.max(1, (y1 - y0) >> 1)) for (let xx = x0; xx < x1; xx += Math.max(1, (x1 - x0) >> 1)) { t += gray[yy * w + xx]; n++; }

    for (let y = 1; y < sh - 1; y++) for (let x = 1; x < sw - 1; x++) {

    if (sharp < opt.minSharpness) warnings.push(`Ảnh hơi mờ (độ nét ${sharp.toFixed(1)}).`);

  }

  // ======================================================================= Dò dấu định vị

  /**
   * Tìm tờ giấy (vùng sáng liên thông lớn nhất) trên ảnh thu nhỏ: dùng để bỏ các vết tối ngoài tờ phiếu
   * (vân bàn, đồ vật) và ước lượng cỡ trang. Trả về null nếu không tách được (vd nền cũng sáng).
   */
  function findPaper(gray, w, h) {
    const f = Math.max(1, Math.round(Math.max(w, h) / 500));
    const sw = Math.max(1, Math.floor(w / f)), sh = Math.max(1, Math.floor(h / f));
    const small = new Uint8Array(sw * sh), hist = new Float64Array(256);
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      let s = 0;
      for (let yy = 0; yy < f; yy++) for (let xx = 0; xx < f; xx++) s += gray[(y * f + yy) * w + x * f + xx];
      const v = (s / (f * f)) | 0;

    }
    const t = otsu(hist);
    const bright = new Uint8Array(sw * sh);
    for (let i = 0; i < bright.length; i++) bright[i] = small[i] > t ? 1 : 0;
    const cc = labelComponents(bright, sw, sh);
    let L = 0;
    for (let c = 1; c <= cc.count; c++) if (!L || cc.area[c] > cc.area[L]) L = c;
    if (!L || cc.area[L] < sw * sh * 0.12) return null;
    // Bên trong tờ giấy = mọi điểm không đi tới được mép ảnh khi đi qua các điểm không thuộc tờ giấy.
    const inside = new Uint8Array(sw * sh).fill(1);
    const stack = [];
    const push = i => { if (inside[i] && cc.labels[i] !== L) { inside[i] = 0; stack.push(i); } };
    for (let x = 0; x < sw; x++) { push(x); push((sh - 1) * sw + x); }
    for (let y = 0; y < sh; y++) { push(y * sw); push(y * sw + sw - 1); }
    while (stack.length) {
      const i = stack.pop(), x = i % sw, y = (i / sw) | 0;

    }
    let insideCount = 0;
    for (let i = 0; i < inside.length; i++) insideCount += inside[i];
    return {
      f, sw, sh, inside, fraction: insideCount / inside.length,
      widthPx: Math.min(cc.maxx[L] - cc.minx[L] + 1, cc.maxy[L] - cc.miny[L] + 1) * f
    };
  }

  function insidePaper(paper, x, y) {
    if (!paper) return true;
    const cx = Math.floor(x / paper.f), cy = Math.floor(y / paper.f);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = cx + dx, yy = cy + dy;
      if (xx >= 0 && yy >= 0 && xx < paper.sw && yy < paper.sh && paper.inside[yy * paper.sw + xx]) return true;
    }
    return false;
  }

  function detectMarks(gray, bin, w, h, tpl) {
    const anchorNorm = tpl.anchors.reduce((s, a) => s + Math.max(a.rect.width, 1e-4), 0) / Math.max(1, tpl.anchors.length) || 6 / 210;
    const paper = findPaper(gray, w, h);
    const usePaper = paper && paper.fraction < 0.97 ? paper : null;
    const pageWidthPx = usePaper ? Math.min(Math.min(w, h), Math.max(usePaper.widthPx, Math.min(w, h) * 0.3)) : Math.min(w, h);
    const expected = Math.max(6, anchorNorm * pageWidthPx);
    const k = Math.max(3, Math.round(expected * 0.22)) | 1;
    const opened = openSquare(bin, w, h, k);
    const cc = labelComponents(opened, w, h);
    // Ảnh chụp điện thoại: tờ phiếu thường chỉ chiếm 50–90% khung hình nên cho phép dấu nhỏ hơn kỳ vọng.
    const minArea = Math.pow(expected * 0.28, 2), maxArea = Math.pow(expected * 2.6, 2);
    const candidates = [];
    for (let c = 1; c <= cc.count; c++) {
      const area = cc.area[c];
      if (area < minArea || area > maxArea) continue;
      const bw = cc.maxx[c] - cc.minx[c] + 1, bh = cc.maxy[c] - cc.miny[c] + 1;
      if (Math.max(bw, bh) / Math.min(bw, bh) > 2.4) continue;
      const rr = minAreaRect(cc, w, c);
      if (Math.max(rr.w, rr.h) / Math.max(1, Math.min(rr.w, rr.h)) > 1.6) continue;
      const fill = area / rr.area;
      if (fill < 0.82) continue;
      const cx = cc.sx[c] / area, cy = cc.sy[c] / area;
      if (!insidePaper(usePaper, cx, cy)) continue;
      const side = Math.sqrt(area), half = Math.max(1, Math.floor(side / 4));
      let s = 0, n = 0;
      for (let y = Math.max(0, Math.floor(cy) - half); y < Math.min(h, Math.floor(cy) + half); y++)
        for (let x = Math.max(0, Math.floor(cx) - half); x < Math.min(w, Math.floor(cx) + half); x++) { s += gray[y * w + x]; n++; }
      if (!n) continue;
      const darkness = 1 - s / n / 255;
      if (darkness < 0.5) continue;
      candidates.push({ x: cx, y: cy, side, fill, darkness });
    }
    return { candidates, expected, paper: usePaper };
  }

  function orderClockwise(pts) {
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const sorted = pts.slice().sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
    let start = 0;
    for (let i = 1; i < sorted.length; i++) if (sorted[i][0] + sorted[i][1] < sorted[start][0] + sorted[start][1]) start = i;
    return sorted.map((_, i) => sorted[(start + i) % sorted.length]);
  }

  function pickTemplateCorners(anchors) {
    const targets = [[0, 0], [1, 0], [1, 1], [0, 1]], used = new Set(), out = [];
    for (const [tx, ty] of targets) {
      let best = -1, bd = Infinity;
      anchors.forEach((a, j) => {
        if (used.has(j)) return;
        const cx = a.rect.x + a.rect.width / 2, cy = a.rect.y + a.rect.height / 2;
        const d = (cx - tx) ** 2 + (cy - ty) ** 2;
        if (d < bd) { bd = d; best = j; }
      });
      used.add(best); out.push(best);
    }
    return out;
  }

  function pickExtremes(pts) {
    const by = f => pts.reduce((b, p) => (f(p) < f(b) ? p : b));
    return [by(p => p[0] + p[1]), by(p => -(p[0] - p[1])), by(p => -(p[0] + p[1])), by(p => p[0] - p[1])];
  }

  function darkRatio(bin, w, h, c, side) {
    const half = Math.max(2, Math.floor(side / 3));
    const x0 = Math.max(0, Math.floor(c[0]) - half), y0 = Math.max(0, Math.floor(c[1]) - half);
    const x1 = Math.min(w, Math.floor(c[0]) + half), y1 = Math.min(h, Math.floor(c[1]) + half);
    if (x1 <= x0 || y1 <= y0) return 0;
    let n = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) n += bin[y * w + x];
    return n / ((x1 - x0) * (y1 - y0));
  }

  function evaluateHypothesis(quad, shift, corners, tplPts, cands, bin, w, h, tol, side) {
    const src = [], dst = [];
    for (let i = 0; i < 4; i++) { src.push(quad[(i + shift) % 4]); dst.push(tplPts[corners[i]]); }
    const Hm = perspective4(src, dst);
    if (!finiteH(Hm)) return null;
    const inv = invert(Hm);
    if (!inv) return null;
    const used = new Set(), pairs = [];
    let errSum = 0, darkUnmatched = 0;
    for (let a = 0; a < tplPts.length; a++) {
      const p = apply(inv, tplPts[a]);
      let bi = -1, bd = tol;
      for (let c = 0; c < cands.length; c++) {
        if (used.has(c)) continue;
        const d = Math.hypot(p[0] - cands[c].x, p[1] - cands[c].y);
        if (d < bd) { bd = d; bi = c; }
      }
      if (bi >= 0) { used.add(bi); pairs.push({ a, c: bi }); errSum += bd; }
      else darkUnmatched += darkRatio(bin, w, h, p, side) > 0.6 ? 0.5 : 0;
    }
    if (pairs.length < 4) return null;
    const meanErr = errSum / pairs.length;
    return { H: Hm, rotation: shift * 90, pairs, score: pairs.length * 2 + darkUnmatched - meanErr / tol, meanErr };
  }

  function polygonArea(p) {
    let s = 0;
    for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; }
    return Math.abs(s) / 2;
  }
  function isConvex(p) {
    let sign = 0;
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length], c = p[(i + 2) % p.length];
      const z = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      if (Math.abs(z) < 1e-9) continue;
      const s = Math.sign(z);
      if (sign && s !== sign) return false;
      sign = s;
    }
    return sign !== 0;
  }

    if (n < k) return;
    const idx = Array.from({ length: k }, (_, i) => i);
    while (true) {
      yield idx.slice();
      let i = k - 1;
      while (i >= 0 && idx[i] === n - k + i) i--;
      if (i < 0) return;
      idx[i]++;
      for (let j = i + 1; j < k; j++) idx[j] = idx[j - 1] + 1;
    }
  }

  /** Lấy mẫu tối đa n ô tròn của mẫu phiếu (tọa độ canvas W×H). */
  function sampleCells(tpl, W, Hh, n) {
    const all = [];
    for (const reg of buildMap(tpl, W, Hh).regions) for (const g of reg.groups) for (const c of g.cells) all.push(c);
    const step = Math.max(1, Math.floor(all.length / n));
    return all.filter((_, i) => i % step === 0);
  }

  /** Độ dài ảnh của 1 pixel canvas theo hai trục tại tâm trang. */
  function localScale(Hm, W, Hh) {
    const inv = invert(Hm);
    if (!inv) return null;
    const c = [W / 2, Hh / 2], d = Math.max(4, W / 50);
    const p0 = apply(inv, c), px = apply(inv, [c[0] + d, c[1]]), py = apply(inv, [c[0], c[1] + d]);
    return { inv, lx: dist(p0, px) / d, ly: dist(p0, py) / d };
  }

  /** Phạt giả thuyết làm méo tỷ lệ (vd xoay 90° một khung chữ nhật): ảnh chụp thật gần như giữ tỷ lệ. */
  function aspectPenalty(Hm, W, Hh) {
    const s = localScale(Hm, W, Hh);
    if (!s || !(s.lx > 0) || !(s.ly > 0)) return 10;
    const ratio = Math.max(s.lx, s.ly) / Math.min(s.lx, s.ly);
    return 3 * Math.max(0, Math.log(ratio) - Math.log(1.35));
  }

  /** Tỷ lệ điểm tối quanh vị trí các ô tròn khi chiếu ngược lên ảnh: đúng chiều thì gặp nét in vòng tròn/chữ, sai chiều thì gặp giấy trắng. */
  function gridFit(Hm, cells, bin, w, h, W, Hh) {
    const s = localScale(Hm, W, Hh);
    if (!s || !cells.length) return 0;
    const k = (s.lx + s.ly) / 2;
    let sum = 0, n = 0;
    for (const c of cells) {
      const p = apply(s.inv, [c.x, c.y]);
      const r = Math.max(1, Math.round(c.r * k));
      const x0 = Math.round(p[0]) - r, y0 = Math.round(p[1]) - r, x1 = Math.round(p[0]) + r, y1 = Math.round(p[1]) + r;
      n++;
      if (x0 < 0 || y0 < 0 || x1 >= w || y1 >= h) continue;
      let dark = 0;
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) dark += bin[y * w + x];
      sum += dark / ((x1 - x0 + 1) * (y1 - y0 + 1));
    }
    return n ? sum / n : 0;
  }

  function align(gray, bin, w, h, det, tpl, W, Hh) {
    const anchors = tpl.anchors;
    if (anchors.length < 4) return { ok: false, error: 'Mẫu phiếu cần ít nhất 4 dấu định vị.', expected: anchors.length };
    const cands = det.candidates;
    if (cands.length < 4)
      return { ok: false, error: `Chỉ thấy ${cands.length}/${anchors.length} ô vuông đen định vị – hãy chụp đủ cả tờ phiếu (thấy rõ 4 góc).`, expected: anchors.length };
    const tplPts = anchors.map(a => [(a.rect.x + a.rect.width / 2) * W, (a.rect.y + a.rect.height / 2) * Hh]);
    const corners = pickTemplateCorners(anchors);
    const tol = det.expected * 0.8 + Math.hypot(w, h) * 0.006;
    const hyps = [];
    const add = hyp => { if (hyp) hyps.push(hyp); };
    const top = () => hyps.reduce((b, x) => (!b || x.score > b.score ? x : b), null);
    const ext = pickExtremes(cands.map(c => [c.x, c.y]));
    for (let k = 0; k < 4; k++) add(evaluateHypothesis(ext, k, corners, tplPts, cands, bin, w, h, tol, det.expected));
    const required = Math.max(4, Math.ceil(anchors.length * 0.75));
    if (!top() || top().pairs.length < required) {
      const topC = cands.slice().sort((a, b) => b.fill * b.darkness - a.fill * a.darkness).slice(0, 12).map(c => [c.x, c.y]);
      const minArea = w * h * 0.08;
      for (const combo of combinations(topC.length, 4)) {
        const ordered = orderClockwise(combo.map(i => topC[i]));
        if (!isConvex(ordered) || polygonArea(ordered) < minArea) continue;
        for (let k = 0; k < 4; k++) add(evaluateHypothesis(ordered, k, corners, tplPts, cands, bin, w, h, tol, det.expected));
      }
    }
    if (!hyps.length)
      return { ok: false, error: 'Không ghép được các ô vuông định vị với mẫu phiếu (sai mẫu phiếu, ảnh bị cắt góc hoặc chụp quá nghiêng).', expected: anchors.length };
    // Các giả thuyết gần bằng điểm (vd mẫu chỉ có 4 neo giống nhau ở 4 góc → xoay 0/90/180/270° đều khớp):
    // phân định bằng tỷ lệ khung hình hợp lý và độ khớp của lưới ô tròn với nét in trên ảnh.
    hyps.sort((a, b) => b.score - a.score);
    const contenders = hyps.filter(x => x.score >= hyps[0].score - 1.0).slice(0, 8);
    let best = contenders[0];
    if (contenders.length > 1) {
      const cells = sampleCells(tpl, W, Hh, 360);
      for (const c of contenders) c.final = c.score + 2.5 * gridFit(c.H, cells, bin, w, h, W, Hh) - aspectPenalty(c.H, W, Hh);
      best = contenders.reduce((b, x) => (x.final > b.final ? x : b));
    }
    if (best.pairs.length < 4)
      return { ok: false, error: 'Không ghép được các ô vuông định vị với mẫu phiếu (sai mẫu phiếu, ảnh bị cắt góc hoặc chụp quá nghiêng).', expected: anchors.length };

    const src = best.pairs.map(p => [cands[p.c].x, cands[p.c].y]);
    const dst = best.pairs.map(p => tplPts[p.a]);
    let Hm = best.pairs.length >= 5 ? fitHomography(src, dst, Math.max(3, W / 300)) : best.H;
    if (!finiteH(Hm)) Hm = best.H;
    if (!finiteH(Hm)) return { ok: false, error: 'Ma trận phối cảnh không hợp lệ.', expected: anchors.length };
    const error = src.reduce((s, p, i) => s + dist(apply(Hm, p), dst[i]), 0) / src.length;

    const warnings = [];
    const inv = invert(Hm);
    let skew = 0;
    if (inv) {
      const tl = apply(inv, tplPts[corners[0]]), tr = apply(inv, tplPts[corners[1]]);
      skew = Math.atan2(tr[1] - tl[1], tr[0] - tl[0]) * 180 / Math.PI - best.rotation;
      while (skew > 180) skew -= 360;
      while (skew < -180) skew += 360;
    }
    if (best.rotation !== 0) warnings.push(`Phiếu bị xoay ${best.rotation}° – đã tự xoay lại.`);
    if (Math.abs(skew) > 2) warnings.push(`Phiếu bị nghiêng ${skew.toFixed(1)}° – đã tự hiệu chỉnh.`);
    if (best.pairs.length < anchors.length) warnings.push(`Chỉ khớp ${best.pairs.length}/${anchors.length} dấu định vị.`);
    return { ok: true, H: Hm, rotation: best.rotation, matched: best.pairs.length, expected: anchors.length, error, skew, warnings, matchedAnchors: best.pairs.map(p => p.a) };
  }

  // ======================================================================= Nắn ảnh

  /** Nắn ảnh nguồn về canvas W×H theo ma trận Hm (nguồn → canvas). Trả về ảnh xám (và RGBA nếu có). */
  function warp(gray, rgba, w, h, Hm, W, Hh) {
    const inv = invert(Hm);
    const g = new Uint8Array(W * Hh);
    const out = rgba ? new Uint8ClampedArray(W * Hh * 4) : null;
    const [a, b, c, d, e, f, p, q, r] = inv;
    for (let y = 0; y < Hh; y++) {
      for (let x = 0; x < W; x++) {
        const den = p * x + q * y + r;
        const sx = (a * x + b * y + c) / den, sy = (d * x + e * y + f) / den;
        const o = y * W + x;
        if (!(sx >= 0 && sy >= 0 && sx <= w - 1 && sy <= h - 1)) {
          g[o] = 255;
          if (out) { const k = o * 4; out[k] = out[k + 1] = out[k + 2] = out[k + 3] = 255; }
          continue;
        }
        const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0;
        const x1 = x0 + 1 < w ? x0 + 1 : x0, y1 = y0 + 1 < h ? y0 + 1 : y0;
        const i00 = y0 * w + x0, i01 = y0 * w + x1, i10 = y1 * w + x0, i11 = y1 * w + x1;
        const w00 = (1 - fx) * (1 - fy), w01 = fx * (1 - fy), w10 = (1 - fx) * fy, w11 = fx * fy;

        if (out) {
          const k = o * 4, k00 = i00 * 4, k01 = i01 * 4, k10 = i10 * 4, k11 = i11 * 4;
          out[k] = rgba[k00] * w00 + rgba[k01] * w01 + rgba[k10] * w10 + rgba[k11] * w11;
          out[k + 1] = rgba[k00 + 1] * w00 + rgba[k01 + 1] * w01 + rgba[k10 + 1] * w10 + rgba[k11 + 1] * w11;
          out[k + 2] = rgba[k00 + 2] * w00 + rgba[k01 + 2] * w01 + rgba[k10 + 2] * w10 + rgba[k11 + 2] * w11;
          out[k + 3] = 255;
        }
      }
    }
    return { gray: g, rgba: out };
  }

  /** Tinh chỉnh: dò lại dấu định vị trên ảnh đã nắn và hiệu chỉnh sai lệch còn lại. */
  function refine(gray, w, h, W, Hh, Hm, map) {
    const inv = invert(Hm);
    if (!inv) return { H: Hm, error: null, matched: 0 };
    // Chỉ nắn vùng quanh từng dấu định vị (nhanh hơn nắn cả trang).
    const sample = (x, y) => {
      const d = inv[6] * x + inv[7] * y + inv[8];
      const sx = (inv[0] * x + inv[1] * y + inv[2]) / d, sy = (inv[3] * x + inv[4] * y + inv[5]) / d;
      if (!(sx >= 0 && sy >= 0 && sx <= w - 1 && sy <= h - 1)) return 255;
      const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0, x1 = x0 + 1 < w ? x0 + 1 : x0, y1 = y0 + 1 < h ? y0 + 1 : y0;
      return (gray[y0 * w + x0] * (1 - fx) + gray[y0 * w + x1] * fx) * (1 - fy) + (gray[y1 * w + x0] * (1 - fx) + gray[y1 * w + x1] * fx) * fy + 0.5 | 0;
    };
    const measured = [], expected = [];
    for (const a of map.anchors) {
      const center = [a.x + a.w / 2, a.y + a.h / 2];
      const pad = Math.max(a.w, a.h) * 0.8;
      const rx = Math.max(0, Math.trunc(a.x - pad)), ry = Math.max(0, Math.trunc(a.y - pad));
      const rx1 = Math.min(W, Math.trunc(a.x - pad) + Math.trunc(a.w + 2 * pad)), ry1 = Math.min(Hh, Math.trunc(a.y - pad) + Math.trunc(a.h + 2 * pad));
      const rw = rx1 - rx, rh = ry1 - ry;
      if (rw < 4 || rh < 4) continue;
      const roi = new Uint8Array(rw * rh), hist = new Float64Array(256);
      for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) { const v = sample(x + rx, y + ry); roi[y * rw + x] = v; hist[v]++; }
      const t = otsu(hist);
      const bin = new Uint8Array(rw * rh);
      for (let i = 0; i < bin.length; i++) bin[i] = roi[i] <= t ? 1 : 0;
      const cc = labelComponents(bin, rw, rh);
      const expArea = a.w * a.h;
      let found = null, bestDiff = Infinity;
      for (let c = 1; c <= cc.count; c++) {
        const area = cc.area[c];
        if (area < expArea * 0.35 || area > expArea * 2.5) continue;
        const bw = cc.maxx[c] - cc.minx[c] + 1, bh = cc.maxy[c] - cc.miny[c] + 1;
        if (area / (bw * bh) < 0.75) continue;
        const p = [cc.sx[c] / area + rx, cc.sy[c] / area + ry];
        const diff = Math.abs(area - expArea) / expArea + dist(p, center) / Math.max(a.w, 1);
        if (diff < bestDiff) { bestDiff = diff; found = p; }
      }
      if (found) { measured.push(found); expected.push(center); }
    }
    if (measured.length < 4) return { H: Hm, error: null, matched: measured.length };
    const before = measured.reduce((s, m, i) => s + dist(m, expected[i]), 0) / measured.length;
    const corr = measured.length >= 5 ? fitHomography(measured, expected, 3) : perspective4(measured, expected);
    if (!finiteH(corr)) return { H: Hm, error: before, matched: measured.length };
    const after = measured.reduce((s, m, i) => s + dist(apply(corr, m), expected[i]), 0) / measured.length;
    if (!(after < before)) return { H: Hm, error: before, matched: measured.length };
    return { H: normalizeH(multiply(corr, Hm)), error: after, matched: measured.length };
  }

  // ======================================================================= Đo độ tô

  function resizeArea(src, w, h, nw, nh) {
    const out = new Float32Array(nw * nh);
    for (let y = 0; y < nh; y++) {
      const y0 = Math.floor(y * h / nh), y1 = Math.max(y0 + 1, Math.floor((y + 1) * h / nh));
      for (let x = 0; x < nw; x++) {
        const x0 = Math.floor(x * w / nw), x1 = Math.max(x0 + 1, Math.floor((x + 1) * w / nw));
        let s = 0;
        for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) s += src[yy * w + xx];
        out[y * nw + x] = s / ((y1 - y0) * (x1 - x0));
      }
    }
    return out;
  }
  function minMaxFilter(src, w, h, k, isMax) {
    const half = k >> 1, tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = isMax ? -Infinity : Infinity;
      for (let i = Math.max(0, x - half); i <= Math.min(w - 1, x + half); i++) { const s = src[y * w + i]; v = isMax ? (s > v ? s : v) : (s < v ? s : v); }
      tmp[y * w + x] = v;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let v = isMax ? -Infinity : Infinity;
      for (let i = Math.max(0, y - half); i <= Math.min(h - 1, y + half); i++) { const s = tmp[i * w + x]; v = isMax ? (s > v ? s : v) : (s < v ? s : v); }
      out[y * w + x] = v;
    }
    return out;
  }
  function gaussian(src, w, h, sigma) {
    const r = Math.max(1, Math.ceil(sigma * 3)), k = [];
    let sum = 0;
    for (let i = -r; i <= r; i++) { const v = Math.exp(-(i * i) / (2 * sigma * sigma)); k.push(v); sum += v; }
    for (let i = 0; i < k.length; i++) k[i] /= sum;
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0;
      for (let i = -r; i <= r; i++) s += src[y * w + clamp(x + i, 0, w - 1)] * k[i + r];
      tmp[y * w + x] = s;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0;
      for (let i = -r; i <= r; i++) s += tmp[clamp(y + i, 0, h - 1) * w + x] * k[i + r];
      out[y * w + x] = s;
    }
    return out;
  }

  /** Làm phẳng độ sáng: chia ảnh cho nền (phép đóng hình thái xóa nét mực) để nền ≈ 255 – bù bóng đổ ảnh chụp. */
  function flattenIllumination(gray, w, h, maxRadius) {
    const k = Math.max(15, ((maxRadius * 5) | 0) | 1);
    const sw = Math.max(1, (w / 4) | 0), sh = Math.max(1, (h / 4) | 0);
    const small = resizeArea(gray, w, h, sw, sh);
    const kk = Math.max(3, ((k / 4) | 0) | 1);
    let bg = minMaxFilter(minMaxFilter(small, sw, sh, kk, true), sw, sh, kk, false);
    bg = gaussian(bg, sw, sh, Math.max(2, k / 8));
    const flat = new Uint8Array(w * h);
    const fx = sw / w, fy = sh / h;
    for (let y = 0; y < h; y++) {
      const syf = Math.max(0, (y + 0.5) * fy - 0.5), y0 = Math.min(sh - 1, syf | 0), y1 = Math.min(sh - 1, y0 + 1), wy = syf - y0;
      for (let x = 0; x < w; x++) {
        const sxf = Math.max(0, (x + 0.5) * fx - 0.5), x0 = Math.min(sw - 1, sxf | 0), x1 = Math.min(sw - 1, x0 + 1), wx = sxf - x0;
        const b = (bg[y0 * sw + x0] * (1 - wx) + bg[y0 * sw + x1] * wx) * (1 - wy) + (bg[y1 * sw + x0] * (1 - wx) + bg[y1 * sw + x1] * wx) * wy;
        const v = b > 0 ? gray[y * w + x] * 255 / b : 0;
        flat[y * w + x] = v > 255 ? 255 : v + 0.5;
      }
    }
    return flat;
  }

  const maskCache = new Map();
  function circleMask(r) {
    if (maskCache.has(r)) return maskCache.get(r);
    const pts = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r + r * 0.3) pts.push(dx, dy);
    const m = new Int32Array(pts);
    maskCache.set(r, m);
    return m;
  }

  function measureBubbles(wg, W, Hh, map) {
    const cells = [];
    for (const reg of map.regions) for (const g of reg.groups) for (const c of g.cells) cells.push(c);
    if (!cells.length) return [];
    const maxR = cells.reduce((m, c) => Math.max(m, c.r), 0);
    const flat = flattenIllumination(wg, W, Hh, maxR);
    // Ngưỡng mực: Otsu trên điểm ảnh trong các ô tròn.
    const hist = new Float64Array(256), step = Math.max(1, Math.floor(cells.length / 400));
    for (let i = 0; i < cells.length; i += step) {
      const c = cells[i], r = Math.round(c.r);
      const x0 = Math.max(0, (c.x | 0) - r), y0 = Math.max(0, (c.y | 0) - r), x1 = Math.min(W, (c.x | 0) - r + 2 * r + 1), y1 = Math.min(Hh, (c.y | 0) - r + 2 * r + 1);
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) hist[flat[y * W + x]]++;
    }
    const inkThr = clamp(otsu(hist), 110, 190);
    const out = [];
    for (const reg of map.regions) {
      for (const g of reg.groups) {
        const bubbles = g.cells.map(cell => {
          const r = Math.max(1, Math.round(cell.r * 0.68));
          const mask = circleMask(r), area = mask.length / 2;
          const shift = Math.max(1, Math.round(cell.r * 0.2));
          let bestFill = 0, bestDark = 0, first = true;
          for (const dy of [0, -shift, shift]) for (const dx of [0, -shift, shift]) {
            const cx = Math.round(cell.x) + dx, cy = Math.round(cell.y) + dy;
            if (cx - r < 0 || cy - r < 0 || cx + r >= W || cy + r >= Hh) continue;
            let ink = 0;
            for (let k = 0; k < mask.length; k += 2) if (flat[(cy + mask[k + 1]) * W + cx + mask[k]] <= inkThr) ink++;
            const fill = ink / area;
            if (!first && fill <= bestFill) continue;
            let s = 0;
            for (let k = 0; k < mask.length; k += 2) s += flat[(cy + mask[k + 1]) * W + cx + mask[k]];
            bestFill = fill; bestDark = 1 - s / area / 255; first = false;
          }
          return { cell, fill: bestFill, dark: bestDark };
        });
        out.push({ region: reg.region, group: g, bubbles });
      }
    }
    return out;
  }

  // ======================================================================= Quyết định đáp án

  function median(sorted) {
    const n = sorted.length;
    return n === 0 ? 0 : n % 2 ? sorted[n >> 1] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
  }

  function computeThresholds(ms, opt) {
    const fills = [];
    for (const m of ms) for (const b of m.bubbles) fills.push(b.fill);
    fills.sort((a, b) => a - b);
    let t;
    if (!fills.length) return { blank: opt.blank, filled: opt.filled, baseline: 0, darkLimit: 1 };
    if (!opt.adaptive) t = { blank: opt.blank, filled: opt.filled, baseline: 0, darkLimit: 1 };
    else {
      const lower = fills.slice(0, Math.max(1, Math.floor(fills.length * 0.6)));
      const baseline = median(lower);
      const mad = median(lower.map(f => Math.abs(f - baseline)).sort((a, b) => a - b));
      const sigma = 1.4826 * mad;
      const blank = clamp(Math.max(opt.blank, baseline + Math.max(0.08, 4 * sigma)), 0.05, 0.6);
      const filled = clamp(Math.max(opt.filled, blank + opt.minSeparation), blank + 0.05, 0.85);
      t = { blank, filled, baseline, darkLimit: 1 };
    }
    const dark = [];
    for (const m of ms) for (const b of m.bubbles) if (b.fill < t.blank) dark.push(b.dark);
    if (dark.length >= 10) {
      dark.sort((a, b) => a - b);
      const md = median(dark);
      const sg = 1.4826 * median(dark.map(d => Math.abs(d - md)).sort((a, b) => a - b));
      t.darkLimit = Math.min(0.95, md + Math.max(0.07, 4 * sg));
    }
    return t;
  }

  function findLightMark(m, t) {
    if (m.bubbles.length < 2) return -1;
    let best = -1, bestMargin = 0;
    m.bubbles.forEach((b, i) => {
      if (b.dark < t.darkLimit) return;
      const others = m.bubbles.filter((_, j) => j !== i).map(x => x.dark).sort((a, c) => a - c);
      const margin = b.dark - median(others);
      if (margin >= 0.08 && margin > bestMargin) { best = i; bestMargin = margin; }
    });
    return best;
  }

  function decide(m, t, opt) {
    const bs = m.bubbles;
    if (!bs.length) return { m, index: -1, value: '', issue: ISSUE.Blank, conf: 1 };
    const order = bs.map((_, i) => i).sort((a, b) => bs[b].fill - bs[a].fill);
    const f1 = bs[order[0]].fill, f2 = order.length > 1 ? bs[order[1]].fill : 0;
    const filledCount = bs.filter(b => b.fill >= t.filled).length;
    if (f1 < t.blank) {
      if (findLightMark(m, t) >= 0) return { m, index: -1, value: UNCLEAR, issue: ISSUE.Low, conf: 0.3 };
      const conf = f1 <= 0.6 * t.blank ? 1 : 1 - 0.5 * (f1 - 0.6 * t.blank) / (0.4 * t.blank);
      return { m, index: -1, value: '', issue: ISSUE.Blank, conf: clamp(conf, 0.5, 1) };
    }
    if (filledCount >= 2) return { m, index: -1, value: MULTI, issue: ISSUE.Multiple, conf: clamp(0.5 + 0.5 * (f2 - t.filled) / 0.15, 0.5, 1) };
    if (f1 < t.filled) return { m, index: -1, value: UNCLEAR, issue: ISSUE.Low, conf: clamp(0.2 + 0.3 * (f1 - t.blank) / Math.max(1e-6, t.filled - t.blank), 0, 0.5) };
    const strength = clamp((f1 - t.blank) / Math.max(1e-6, t.filled - t.blank), 0, 1.5) / 1.5;
    const separation = clamp((f1 - f2) / (2 * opt.minSeparation), 0, 1);
    const confidence = 0.5 * strength + 0.5 * separation;
    if (f2 >= t.blank && f1 - f2 < opt.minSeparation) return { m, index: -1, value: UNCLEAR, issue: ISSUE.Low, conf: Math.min(confidence, 0.4) };
    if (confidence < opt.minConfidence) return { m, index: -1, value: UNCLEAR, issue: ISSUE.Low, conf: confidence };

  }

  function toChar(d) {
    if (d.issue === ISSUE.Blank) return BLANK;
    if (d.issue === ISSUE.Multiple) return MULTI;
    if (d.issue === ISSUE.Low || d.issue === ISSUE.Invalid) return UNCLEAR;
    return d.value.length ? d.value[0] : UNCLEAR;
  }
  function trimBlank(s) { return s.replace(/^_+|_+$/g, ''); }

  function buildField(decisions, kind) {
    const field = decisions.filter(d => d.m.region.kind === kind);
    if (!field.length) return null;
    const region = field[0].m.region;
    const ordered = field.filter(d => d.m.region === region).sort((a, b) => a.m.group.pos - b.m.group.pos);
    const raw = ordered.map(toChar).join('');
    const trimmed = trimBlank(raw);
    const complete = trimmed.length > 0 && /^\d+$/.test(trimmed);
    return { value: complete ? trimmed : raw, complete, confidence: Math.min(...ordered.map(d => d.conf)) };
  }

  function worst(items, allBlankIsBlank) {
    if (items.some(d => d.issue === ISSUE.Multiple)) return ISSUE.Multiple;
    if (items.some(d => d.issue === ISSUE.Low)) return ISSUE.Low;
    if (allBlankIsBlank && items.every(d => d.issue === ISSUE.Blank)) return ISSUE.Blank;
    return ISSUE.None;
  }

  function buildQuestions(decisions) {
    const map = new Map();
    for (const d of decisions) {
      if (d.m.group.kind === 'digit') continue;
      const key = d.m.group.part * 10000 + d.m.group.q;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(d);
    }
    const G = H.grading;
    const out = [];
    for (const key of [...map.keys()].sort((a, b) => a - b)) {
      const items = map.get(key).sort((a, b) => a.m.group.pos - b.m.group.pos);
      const kind = items[0].m.group.kind;
      const fills = [];
      for (const d of items) for (const b of d.m.bubbles) fills.push(Math.round(b.fill * 1000) / 1000);
      let value, issue;
      if (kind === 'choice') {
        value = items[0].value.toUpperCase();
        issue = items[0].issue;
      } else if (kind === 'tf') {
        value = items.map(d => (d.issue === ISSUE.None ? (G.normalizeTFChar(d.value[0] || '?') || UNCLEAR) : toChar(d))).join('');
        issue = worst(items, true);
      } else {
        const raw = items.map(toChar).join('');
        issue = worst(items, true);
        value = trimBlank(raw);
        if (issue === ISSUE.None || (issue === ISSUE.Blank && value.length > 0)) {
          const parsed = G.parseShortAnswer(raw, { maxLength: items.length });
          issue = parsed.status === 'ok' ? ISSUE.None : parsed.status === 'blank' ? ISSUE.Blank : ISSUE.Invalid;
          if (parsed.status === 'ok') value = parsed.canonical;
        }
      }
      out.push({ part: items[0].m.group.part, q: items[0].m.group.q, kind, value, issue, confidence: Math.round(Math.min(...items.map(d => d.conf)) * 1e4) / 1e4, fills });
    }
    return out;
  }

  // ======================================================================= Dò nhanh trên khung hình camera

  /**
   * Dò phiếu trên một khung hình camera nhỏ (~720px): tìm ô vuông đen, ghép với mẫu phiếu.
   * Trả về vị trí (pixel của ảnh vào) của tâm 4 dấu định vị ở 4 góc mẫu và các ô vuông đen tìm thấy.
   */
  function detectLive(image, tpl) {
    const { rgba, w, h } = image;
    const gray = image.gray || rgbaToGray(rgba, w, h);
    const den = blur5(gray, w, h);
    const block = Math.max(31, ((Math.min(w, h) / 12) | 0) | 1);
    const bin = adaptiveThresholdInv(den, w, h, block, 12);
    const det = detectMarks(gray, bin, w, h, tpl);
    const candidates = det.candidates.map(c => ({ x: c.x, y: c.y, side: c.side }));
    if (tpl.anchors.length < 4) return { ok: false, candidates };
    const [W, Hh] = canvasSize(tpl, 60);
    const al = align(gray, bin, w, h, det, tpl, W, Hh);
    if (!al.ok) return { ok: false, candidates };
    const inv = invert(al.H);
    if (!inv) return { ok: false, candidates };
    const corners = pickTemplateCorners(tpl.anchors).map(i => {
      const a = tpl.anchors[i].rect;
      const p = apply(inv, [(a.x + a.width / 2) * W, (a.y + a.height / 2) * Hh]);
      return { x: p[0], y: p[1], matched: al.matchedAnchors.includes(i) };
    });
    return { ok: true, candidates, corners, matched: al.matched, expected: al.expected, rotation: al.rotation, error: al.error };
  }

  /** Tâm chuẩn hóa (0..1 theo trang) của 4 dấu định vị góc mẫu: trên trái, trên phải, dưới phải, dưới trái. */
  function cornerAnchors(tpl) {
    return pickTemplateCorners(tpl.anchors).map(i => {
      const a = tpl.anchors[i].rect;
      return { x: a.x + a.width / 2, y: a.y + a.height / 2, w: a.width, h: a.height };
    });
  }

  // ======================================================================= Quy trình đầy đủ

  /**
   * Nhận diện một ảnh phiếu.
   * @param {{rgba:Uint8ClampedArray|Uint8Array, w:number, h:number}} image ảnh làm việc (đã thu về ≤ ~2200px)
   * @param {object} tpl mẫu phiếu (parseTemplate)
   */
  function recognize(image, tpl, options) {
    const opt = Object.assign({}, OPTIONS, options || {});
    const t0 = Date.now();
    const { rgba, w, h } = image;
    const gray = image.gray || rgbaToGray(rgba, w, h);
    const quality = assessQuality(gray, w, h, opt);
    if (!quality.ok) return { ok: false, error: quality.error, warnings: quality.warnings };
    const warnings = quality.warnings.slice();
    const denoised = blur5(gray, w, h);
    const block = Math.max(31, ((Math.min(w, h) / 12) | 0) | 1);
    const bin = adaptiveThresholdInv(denoised, w, h, block, 12);
    const det = detectMarks(gray, bin, w, h, tpl);
    const [W, Hh] = canvasSize(tpl, opt.dpi);
    const map = buildMap(tpl, W, Hh);
    const al = align(gray, bin, w, h, det, tpl, W, Hh);
    if (!al.ok) return { ok: false, error: al.error, warnings, anchorsFound: det.candidates.length };

    let Hm = al.H;
    const ref = refine(gray, w, h, W, Hh, Hm, map);
    let alignError = al.error / 1; // sai số trên canvas (đơn vị pixel canvas)
    if (ref.error != null) { Hm = ref.H; alignError = ref.error; }
    warnings.push(...al.warnings.filter(x => !(x.startsWith('Chỉ khớp') && (ref.matched || 0) >= al.expected)));
    const final = warp(gray, rgba, w, h, Hm, W, Hh);

    const ms = measureBubbles(final.gray, W, Hh, map);
    const t = computeThresholds(ms, opt);
    const decisions = ms.map(m => decide(m, t, opt));
    const candidate = buildField(decisions, 'CandidateNumber');
    const examCode = buildField(decisions, 'ExamCode');
    const questions = buildQuestions(decisions);
    const needsReview = alignError > opt.maxAlignmentErrorPx;
    if (needsReview) warnings.push(`Sai số căn chỉnh ${alignError.toFixed(1)}px – nên kiểm tra lại ảnh.`);
    return {
      ok: true, warnings, rotation: al.rotation, anchorsMatched: Math.max(al.matched, ref.matched || 0), anchorsExpected: al.expected,
      alignmentError: Math.round(alignError * 100) / 100, skew: al.skew,
      candidateNumber: candidate, examCode, questions, thresholds: t,
      confidence: decisions.length ? decisions.reduce((s, d) => s + d.conf, 0) / decisions.length : 0,
      warped: { w: W, h: Hh, gray: final.gray, rgba: final.rgba }, map,
      elapsedMs: Date.now() - t0
    };
  }

  // ======================================================================= Vẽ kết quả chấm (đúng xanh, sai đỏ, tô lỗi vàng)

  const COLORS = { correct: [0x2E, 0x7D, 0x32], wrong: [0xD3, 0x2F, 0x2F], problem: [0xF9, 0xA8, 0x25], detected: [0x15, 0x65, 0xC0] };

  function makePainter(img, W, Hh, radius) {
    const overlay = new Uint8ClampedArray(img);
    const strokes = [];
    const thickness = Math.max(2, Math.floor(W / 520));
    const blendPx = (buf, x, y, col, a) => {
      if (x < 0 || y < 0 || x >= W || y >= Hh || a <= 0) return;
      const k = (y * W + x) * 4;
      buf[k] += (col[0] - buf[k]) * a; buf[k + 1] += (col[1] - buf[k + 1]) * a; buf[k + 2] += (col[2] - buf[k + 2]) * a;
    };
    const disc = (buf, cx, cy, R, col) => {
      for (let y = Math.floor(cy - R - 1); y <= Math.ceil(cy + R + 1); y++)
        for (let x = Math.floor(cx - R - 1); x <= Math.ceil(cx + R + 1); x++)
          blendPx(buf, x, y, col, clamp(R + 0.5 - Math.hypot(x - cx, y - cy), 0, 1));
    };
    const ring = (buf, cx, cy, R, T, col) => {
      const lo = R - T / 2, hi = R + T / 2;
      for (let y = Math.floor(cy - hi - 1); y <= Math.ceil(cy + hi + 1); y++)
        for (let x = Math.floor(cx - hi - 1); x <= Math.ceil(cx + hi + 1); x++) {
          const d = Math.hypot(x - cx, y - cy);
          blendPx(buf, x, y, col, clamp(Math.min(d - lo, hi - d) + 0.5, 0, 1));
        }
    };
    const box = (buf, x0, y0, x1, y1, col) => {
      for (let y = Math.max(0, Math.round(y0)); y < Math.min(Hh, Math.round(y1)); y++)
        for (let x = Math.max(0, Math.round(x0)); x < Math.min(W, Math.round(x1)); x++) blendPx(buf, x, y, col, 1);
    };
    return {
      fill(cell, col) {
        const cx = Math.round(cell.x), cy = Math.round(cell.y);
        disc(overlay, cx, cy, radius, col);
        strokes.push(() => ring(img, cx, cy, radius + thickness, thickness + 1, col));
      },
      ring(cell, col) {
        const cx = Math.round(cell.x), cy = Math.round(cell.y);
        strokes.push(() => ring(img, cx, cy, radius + thickness, thickness + 1, col));
      },
      frame(cells, col, filled) {
        if (!cells.length) return;
        const pad = radius * 1.6;
        const x0 = Math.floor(Math.min(...cells.map(c => c.x)) - pad), y0 = Math.floor(Math.min(...cells.map(c => c.y)) - pad);
        const x1 = Math.ceil(Math.max(...cells.map(c => c.x)) + pad), y1 = Math.ceil(Math.max(...cells.map(c => c.y)) + pad);
        if (filled) box(overlay, x0, y0, x1, y1, col);
        const t2 = thickness / 2;
        strokes.push(() => {
          box(img, x0 - t2, y0 - t2, x1 + t2, y0 + t2, col); box(img, x0 - t2, y1 - t2, x1 + t2, y1 + t2, col);
          box(img, x0 - t2, y0 - t2, x0 + t2, y1 + t2, col); box(img, x1 - t2, y0 - t2, x1 + t2, y1 + t2, col);
        });
      },
      finish() {
        for (let i = 0; i < img.length; i += 4) {
          img[i] = overlay[i] * 0.42 + img[i] * 0.58; img[i + 1] = overlay[i + 1] * 0.42 + img[i + 1] * 0.58; img[i + 2] = overlay[i + 2] * 0.42 + img[i + 2] * 0.58;
        }
        for (const s of strokes) s();
      }
    };
  }

  function uniformRadius(map) {
    const radii = [];
    for (const r of map.regions) for (const g of r.groups) for (const c of g.cells) radii.push(c.r);
    if (!radii.length) return 8;
    radii.sort((a, b) => a - b);
    return Math.max(3, Math.round(radii[radii.length >> 1] * 1.05));
  }

  function findCell(cells, value) {
    const G = H.grading;
    const tf = G.normalizeTFChar(value);
    for (const c of cells) {
      if (c.label.length !== 1) continue;
      if (c.label.toUpperCase() === String(value).toUpperCase()) return c;
      if (tf && G.normalizeTFChar(c.label) === tf && !/\d/.test(value)) return c;
    }
    return null;
  }

  function fillThreshold(questions) {
    const all = [];
    for (const q of questions) for (const f of q.fills) all.push(f);
    if (all.length < 10) return 0.35;
    all.sort((a, b) => a - b);
    const blank = all[all.length >> 1], filled = all[Math.min(all.length - 1, Math.round(all.length * 0.97))];
    return clamp(blank + (filled - blank) * 0.5, 0.2, 0.6);
  }

  function markedCells(groups, fills, thr) {
    const cells = [];
    for (const g of groups) for (const c of g.cells) cells.push(c);
    const out = [];
    for (let i = 0; i < cells.length && i < fills.length; i++) if (fills[i] >= thr) out.push(cells[i]);
    return out;
  }

  function subItemOutcome(student, key) {
    const G = H.grading;
