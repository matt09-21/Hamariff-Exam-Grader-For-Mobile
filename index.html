      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'value') e.value = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      e.append(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return e;
  }
  const icon = name => { const t = document.createElement('template'); t.innerHTML = ICON[name]; return t.content.firstChild; };
  const fmt = n => (n == null || !Number.isFinite(n) ? '—' : (Math.round(n * 100) / 100).toLocaleString('vi-VN', { maximumFractionDigits: 2 }));
  const ROMAN = { 1: 'I', 2: 'II', 3: 'III' };
  const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 16)));
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function toast(msg, ms) {
    const t = el('div', { class: 'toast', role: 'status' }, msg);
    document.body.append(t);
    setTimeout(() => t.remove(), ms || 2600);
  }

  function modal(build) {
    const box = el('div', { class: 'box', role: 'dialog', 'aria-modal': 'true' }, el('div', { class: 'grab' }));
    const m = el('div', { class: 'modal' }, box);
    const close = () => { m.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    m.addEventListener('click', e => { if (e.target === m) close(); });
    document.addEventListener('keydown', onKey);
    build(box, close);
    document.body.append(m);
    return close;
  }

  function confirmBox(title, message, okText, danger) {
    return new Promise(resolve => {
      modal((box, close) => {
        const done = v => { close(); resolve(v); };
        box.append(el('h3', null, title), el('p', { class: 'muted', style: 'margin:0 0 14px' }, message),
          el('div', { class: 'row' },
            el('button', { class: 'btn grow', onclick: () => done(false) }, 'Hủy'),
            el('button', { class: `btn grow ${danger ? 'danger' : 'primary'}`, onclick: () => done(true) }, okText)));
      });
    });
  }

  function fileButton(text, accept, opts, onFiles, iconName, cls) {
    const input = el('input', { type: 'file', accept: accept || null, multiple: opts && opts.multiple ? true : null, capture: opts && opts.capture ? 'environment' : null });
    input.addEventListener('change', () => { const files = [...input.files]; input.value = ''; if (files.length) onFiles(files); });
    return el('label', { class: cls || 'btn' }, iconName ? icon(iconName) : null, text, input);
  }

  function notice(kind, content, iconName) {
    return el('div', { class: `notice ${kind}` }, icon(iconName || (kind === 'ok' ? 'check' : kind === 'info' ? 'info' : 'alert')), el('div', null, content));
  }

  // ======================================================================= Lưu trữ (tài khoản Claude nếu có, không thì trên máy)

  const LS_CONFIG = 'hamariff.web.v1.config', LS_RESULTS = 'hamariff.web.v1.results';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

  const Store = {
    mode: 'local', db: null, uid: null, queue: Promise.resolve(),
    async connect() {
      const c = globalThis.claude;
      if (!c || typeof c.use !== 'function') return false;
      try {
        const [db, user] = await withTimeout(Promise.all([c.use('db'), c.use('user')]), 12000);
        const uid = user ? await withTimeout(user.id(), 6000) : null;
        if (!db || !uid) return false;
        this.db = db; this.uid = uid; this.mode = 'cloud';
        return true;
      } catch { return false; }
    },
    configRef() { return this.db.doc(`data/users/${this.uid}/config`); },
    resultsRef() { return this.db.doc(`data/users/${this.uid}/results`).collection('items'); },
    serial(fn) { const p = this.queue.then(fn, fn); this.queue = p.catch(() => {}); return p; },
    async loadCloud() {
      const snap = await withTimeout(this.configRef().get(), 12000);
      const cfg = snap.exists ? snap.data() : null;
      const rs = await withTimeout(this.resultsRef().limit(1000).get(), 15000);
      return { config: cfg, results: rs.docs.map(d => fromCloud(d.data())).filter(Boolean) };
    },
    saveConfig(cfg) {
      lsSet(LS_CONFIG, cfg);
      if (this.mode !== 'cloud') return Promise.resolve();
      return this.serial(() => this.configRef().set(JSON.parse(JSON.stringify(cfg)))).catch(e => this.fail(e));
    },
    saveResult(rec) {
      lsSet(LS_RESULTS, state.results);
      if (this.mode !== 'cloud') return Promise.resolve();
      return this.serial(() => this.resultsRef().doc(rec.id).set(toCloud(rec))).catch(e => this.fail(e));
    },
    deleteResult(id) {
      lsSet(LS_RESULTS, state.results);
      if (this.mode !== 'cloud') return Promise.resolve();
      return this.serial(() => this.resultsRef().doc(id).delete()).catch(e => this.fail(e));
    },
    fail(e) {
      const code = e && e.code;
      if (code === 'quota_exceeded') toast('Bộ nhớ trên tài khoản đã đầy – hãy xuất Excel rồi xóa bớt kết quả cũ.', 5000);
      else if (code === 'invalid_argument' || code === 'revoked' || code === 'not_granted') { this.mode = 'local'; renderTop(); toast('Không lưu được lên tài khoản – đang lưu trên máy này.', 4000); }
    }
  };

  // Kho tài liệu không nhận mảng lồng mảng: lưu answers/details dạng chuỗi JSON.
  function toCloud(rec) {
    const o = JSON.parse(JSON.stringify(rec));
    o.answers = JSON.stringify(rec.answers || []);
    o.details = JSON.stringify(rec.details || []);
    o.qrKey = rec.qrKey ? JSON.stringify(rec.qrKey) : '';
    return o;
  }
  function fromCloud(o) {
    if (!o || !o.id) return null;
    const r = Object.assign({}, o);
    try { if (typeof r.answers === 'string') r.answers = JSON.parse(r.answers); if (typeof r.details === 'string') r.details = JSON.parse(r.details); if (typeof r.qrKey === 'string') r.qrKey = r.qrKey ? JSON.parse(r.qrKey) : null; } catch { return null; }
    return Array.isArray(r.answers) ? r : null;
  }

  /** Ảnh bài đã chấm: giữ trong phiên + IndexedDB trên máy (nếu trình duyệt cho phép). */
  const Img = {
    urls: new Map(), dbp: null,
    open() {
      if (!this.dbp) this.dbp = new Promise(res => {
        try {
          const r = indexedDB.open('hamariff-web', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('img');
          r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
        } catch { res(null); }
      });
      return this.dbp;
    },
    async put(id, blob) {
      if (this.urls.has(id)) URL.revokeObjectURL(this.urls.get(id));
      this.urls.set(id, URL.createObjectURL(blob));
      const db = await this.open();
      if (db) try { db.transaction('img', 'readwrite').objectStore('img').put(blob, id); } catch { /* bỏ qua */ }
    },
    async get(id) {
      if (this.urls.has(id)) return this.urls.get(id);
      const db = await this.open();
      if (!db) return null;
      return new Promise(res => {
        try {
          const rq = db.transaction('img').objectStore('img').get(id);
          rq.onsuccess = () => { if (rq.result) { const u = URL.createObjectURL(rq.result); this.urls.set(id, u); res(u); } else res(null); };
          rq.onerror = () => res(null);
        } catch { res(null); }
      });
    },
    async del(id) {
      if (this.urls.has(id)) { URL.revokeObjectURL(this.urls.get(id)); this.urls.delete(id); }
      const db = await this.open();
      if (db) try { db.transaction('img', 'readwrite').objectStore('img').delete(id); } catch { /* bỏ qua */ }
    }
  };

  // ======================================================================= Trạng thái

  // ======================================================================= Cấu hình quét tự động & kiểm tra hình học 4 điểm
  const DEFAULT_SETTINGS = { part3Score: 0.25, keyMode: 'excel', sens: 'mid', stableMs: 500, cooldownMs: 1500, auto: true };
  // conf: độ tin cậy tối thiểu · ratio: lệch tỉ lệ cho phép (log) · persp: tỉ lệ tối thiểu giữa hai cạnh đối · area: diện tích tối thiểu · move: ngưỡng rung
  const SENS = {
    high: { conf: 0.45, ratio: 0.45, persp: 0.55, area: 0.06, move: 0.035 },
    mid: { conf: 0.60, ratio: 0.30, persp: 0.70, area: 0.10, move: 0.025 },
    low: { conf: 0.75, ratio: 0.20, persp: 0.80, area: 0.16, move: 0.018 }
  };
  const canGrade = () => state.settings.keyMode !== 'excel' || state.keys.length > 0;

  /** Tỉ lệ rộng/cao của hình chữ nhật 4 dấu định vị theo mẫu phiếu. */
  function tplRatio() {
    const t = state.template, c = H.omr.cornerAnchors(t);
    const w = (Math.abs(c[1].x - c[0].x) + Math.abs(c[2].x - c[3].x)) / 2 * t.pageWidthMm;
    const h = (Math.abs(c[3].y - c[0].y) + Math.abs(c[2].y - c[1].y)) / 2 * t.pageHeightMm;
    return w / h;
  }
  /** Kiểm tra hình học 4 điểm (trên trái, trên phải, dưới phải, dưới trái, tọa độ màn hình) → {ok, why, conf}. */
  function checkQuad(c, r, cw, ch, P, ratio0) {
    const no = why => ({ ok: false, why, conf: 0 });
    let sg = 0;
    for (let i = 0; i < 4; i++) {
      const a = c[i], b = c[(i + 1) % 4], e = c[(i + 2) % 4];
      const z = (b[0] - a[0]) * (e[1] - b[1]) - (b[1] - a[1]) * (e[0] - b[0]);
      if (Math.abs(z) < 1 || (sg && Math.sign(z) !== sg)) return no('4 điểm chưa tạo thành góc phiếu hợp lệ – kiểm tra lại vị trí phiếu');
      sg = Math.sign(z);
    }
    const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
    const top = d(c[0], c[1]), bot = d(c[3], c[2]), lef = d(c[0], c[3]), rig = d(c[1], c[2]);
    const rel = Math.abs(Math.log(((top + bot) / (lef + rig)) / ratio0));
    if (rel > P.ratio) return no('Tỉ lệ 4 điểm không khớp mẫu phiếu – kiểm tra đúng mẫu và giữ máy thẳng');
    const pr = Math.min(top, bot) / Math.max(top, bot, 1), pl = Math.min(lef, rig) / Math.max(lef, rig, 1);
    if (Math.min(pr, pl) < P.persp) return no('Phiếu bị nghiêng quá nhiều – giữ máy song song với mặt phiếu');
    let ar = 0; for (let i = 0; i < 4; i++) { const a = c[i], b = c[(i + 1) % 4]; ar += a[0] * b[1] - b[0] * a[1]; }
    if (Math.abs(ar) / 2 < P.area * cw * ch) return no('Phiếu quá nhỏ trong khung – đưa máy lại gần hơn');
    const m = 4;
    if (c.some(p => p[0] < m || p[1] < m || p[0] > cw - m || p[1] > ch - m)) return no('Phiếu chưa nằm đủ trong vùng quét');
    const fit = r.expected ? Math.min(1, (r.matched || 0) / r.expected) : 1;
    const err = Math.max(0, 1 - (r.error || 0) / 12);
    const conf = 0.5 * fit + 0.3 * err + 0.2 * Math.min(pr, pl);
    return { ok: true, why: '', conf };
  }
  /** Độ nét (năng lượng gradient) của khung hình nhỏ – dùng để không chụp khi ảnh đang mờ do rung. */
  function sharpness(d, w, h) {
    let s = 0, n = 0;
    for (let y = 2; y < h - 2; y += 3) {
      let o = (y * w + 2) * 4;
      for (let x = 2; x < w - 2; x += 3, o += 12) { const g = d[o + 1]; s += Math.abs(g - d[o + 5]) + Math.abs(g - d[o + 1 + w * 4]); n++; }
    }
    return n ? s / n : 0;
  }

  const DEFAULT_TEMPLATE = H.omr.parseTemplate(H.DEFAULT_TEMPLATE_JSON);
  const state = {
    template: DEFAULT_TEMPLATE, templateIsDefault: true,
    keys: [], settings: Object.assign({}, DEFAULT_SETTINGS), tplLib: [], tplId: 'default',
    results: [],
    pendingImport: null, typed: { code: '', p1: '', p2: '', p3: '' }, typedOpen: false,
    tab: 'keys', busy: null, current: null, batch: [],
    session: new Map() // id → {clean: Blob, questions, w, h, candidate, examCode}
  };

  function templateToJson(t) {
    return { format: 'hamariff-template', code: t.code, name: t.name, version: t.version, pageWidthMm: t.pageWidthMm, pageHeightMm: t.pageHeightMm, layout: { anchors: t.anchors, regions: t.regions } };
  }
  function configObject() {
    return { v: 1, template: state.templateIsDefault ? null : templateToJson(state.template), tplLib: state.tplLib, tplId: state.tplId, keys: state.keys, settings: state.settings, updatedAt: Date.now() };
  }
  function applyConfig(cfg) {
    if (!cfg) return;
    if (cfg.template) {
      try { state.template = H.omr.parseTemplate(cfg.template); state.templateIsDefault = false; } catch { state.template = DEFAULT_TEMPLATE; state.templateIsDefault = true; }
    } else { state.template = DEFAULT_TEMPLATE; state.templateIsDefault = true; }
    state.keys = Array.isArray(cfg.keys) ? cfg.keys.filter(k => k && k.code && Array.isArray(k.items)) : [];
    state.settings = Object.assign({}, DEFAULT_SETTINGS, cfg.settings || {}, { keyMode: 'excel' });
    state.tplLib = Array.isArray(cfg.tplLib) ? cfg.tplLib.filter(t => t && t.id && t.json) : [];
    state.tplId = state.templateIsDefault ? 'default' : (cfg.tplId || 'default');
  }
  const saveConfig = () => Store.saveConfig(configObject());

  function shortMaxLength() {
    const r = state.template.regions.find(x => x.kind === 'ShortAnswer');
    return r ? Math.max(4, H.omr.groupSize(r)) : 4;
  }
  const gradeSettings = () => ({ part1Score: 0.25, part3Score: state.settings.part3Score, shortMaxLength: shortMaxLength() });
  const hasRegion = kind => state.template.regions.some(r => r.kind === kind);

  // ======================================================================= Chấm

  function gradeRecord(rec) {
    const key = rec.qrKey || state.keys.find(k => k.code === rec.code);
    if (!key) {
      Object.assign(rec, { graded: false, score10: null, raw: null, max: null, correct: 0, partial: 0, incorrect: 0, blank: 0, problems: 0, details: [] });
      return null;
    }
    const g = G.grade(rec.answers.map(a => ({ part: a[0], q: a[1], value: a[2] })), key, gradeSettings());
    Object.assign(rec, {
      graded: true, score10: g.score10, raw: g.raw, max: g.max, correct: g.correct, partial: g.partial, incorrect: g.incorrect, blank: g.blank, problems: g.problems,
      details: g.details.map(d => [d.part, d.q, d.student, d.correct, d.outcome, d.score, d.max])
    });
    return g;
  }
  const detailsToGrading = rec => (rec.graded ? { details: rec.details.map(d => ({ part: d[0], q: d[1], student: d[2], correct: d[3], outcome: d[4], score: d[5], max: d[6] })) } : null);

  /** Danh sách vấn đề cần người chấm để ý trên một bài. */
  function recordProblems(rec) {
    const out = [];
    if (hasRegion('CandidateNumber') && !rec.sbdOk) out.push({ kind: 'bad', text: rec.sbd && rec.sbd.replace(/[_?*]/g, '') ? `Số báo danh đọc chưa rõ (“${rec.sbd}”) – hãy sửa ở ô Số báo danh.` : 'Không đọc được số báo danh – hãy nhập ở ô Số báo danh.' });
    if (rec.qrMissing) out.push({ kind: 'bad', text: 'Không đọc được mã QR trên phiếu – chụp lại cho thấy rõ QR, hoặc đổi nguồn đáp án sang “Kết hợp”.' });
    else if (!rec.code) out.push({ kind: 'bad', text: rec.examCodeRead && /^\d+$/.test(rec.examCodeRead) ? `Mã đề ${rec.examCodeRead} trên phiếu không có trong đáp án – chọn đúng mã đề bên dưới.` : 'Không đọc được mã đề – chọn mã đề bên dưới để chấm.' });
    for (const d of rec.details || []) {
      if (d[4] === 'multiple') out.push({ kind: 'warn', text: `Câu ${d[1]} Phần ${ROMAN[d[0]]}: tô nhiều ô – không tính điểm.` });
      else if (d[4] === 'invalid') out.push({ kind: 'warn', text: `Câu ${d[1]} Phần ${ROMAN[d[0]]}: tô không rõ (tô nhẹ/tẩy chưa sạch) – không tính điểm.` });
    }
    return out;
  }

  async function loadImageFile(file, maxSide) {
    let src, w, h, revoke = null;
    try {
      src = await createImageBitmap(file, { imageOrientation: 'from-image' });
      w = src.width; h = src.height;
    } catch {
      const url = URL.createObjectURL(file); revoke = url;
      src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('Không mở được ảnh (định dạng không hỗ trợ).')); im.src = url; });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    try {
      // Thu nhỏ từng nửa để giảm răng cưa khi ảnh điện thoại rất lớn.
      let cw = w, ch = h, cur = src;
      const target = Math.min(1, maxSide / Math.max(w, h));
      while (cw * target < cw / 2.2) {
        const c = document.createElement('canvas'); c.width = Math.round(cw / 2); c.height = Math.round(ch / 2);
        const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, c.width, c.height);
        cur = c; cw = c.width; ch = c.height;
      }
      const tw = Math.max(1, Math.round(w * target)), th = Math.max(1, Math.round(h * target));
      const canvas = document.createElement('canvas'); canvas.width = tw; canvas.height = th;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(cur, 0, 0, tw, th);
      return { rgba: ctx.getImageData(0, 0, tw, th).data, w: tw, h: th, originalW: w, originalH: h };
    } finally {
      if (src && src.close) src.close();
      if (revoke) URL.revokeObjectURL(revoke);
    }
  }

  function rgbaToBlob(rgba, w, h, quality) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').putImageData(new ImageData(rgba instanceof Uint8ClampedArray ? rgba : new Uint8ClampedArray(rgba), w, h), 0, 0);
    return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', quality || 0.85));
  }
  async function blobToRgba(blob) {
    const bmp = await createImageBitmap(blob);
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(bmp, 0, 0);
    const out = { rgba: x.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height };
    if (bmp.close) bmp.close();
    return out;
  }

  /** Vẽ lại ảnh đã chấm của một bài (từ ảnh nắn phẳng giữ trong phiên). */
  async function renderRecordImage(rec, res) {
    let result = res;
    if (!result) {
      const s = state.session.get(rec.id);
      if (!s) return false;
      const img = await blobToRgba(s.clean);
      result = { warped: { w: img.w, h: img.h, rgba: img.rgba }, map: H.omr.buildMap(state.template, img.w, img.h), questions: s.questions, candidateNumber: s.candidate, examCode: s.examCode };
    }
    const graded = H.omr.renderGraded(result, detailsToGrading(rec));
    await Img.put(rec.id, await rgbaToBlob(graded, result.warped.w, result.warped.h, 0.85));
    return true;
  }

  async function processFiles(files) {
    if (state.busy) return;
    if (!canGrade()) { toast('Hãy nhập đáp án (mã đề) trước khi chấm.'); switchTab('keys'); return; }
    switchTab('scan');
    state.batch = files.length > 1 ? [] : state.batch.filter(b => b.keep);
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      state.busy = { text: files.length > 1 ? `Đang chấm bài ${i + 1}/${files.length}…` : 'Đang nhận diện phiếu…', sub: f.name || 'Ảnh chụp' };
      render();
      await nextFrame();
      let item;
      try {
        const img = await loadImageFile(f, 2000);
        await nextFrame();
        const res = H.omr.recognize(img, state.template);
        item = res.ok ? await finishRecognition(res, f.name, img) : { ok: false, fileName: f.name, error: res.error, warnings: res.warnings || [] };
      } catch (e) {
        item = { ok: false, fileName: f.name, error: 'Không xử lý được ảnh: ' + (e && e.message ? e.message : e) };
      }
      state.current = item;
      if (files.length > 1) state.batch.push(item);
    }
    state.busy = null;
    render();
    if (files.length > 1) {
      const ok = state.batch.filter(b => b.ok).length;
      toast(`Đã chấm ${ok}/${files.length} bài.`);
    }
  }

  async function finishRecognition(res, fileName, orig, qrIn) {
    const mode = state.settings.keyMode, codes = state.keys.map(k => k.code);
    const read = res.examCode ? res.examCode.value : '';
    const qr = qrIn === undefined ? readQr(res, orig) : qrIn;
    const info = (res.warnings || []).slice();
    let code = null, qrKey = null;
    if (mode !== 'qr') {
      code = res.examCode && res.examCode.complete ? G.matchExamCode(read, codes) : null;
      if (!code && !res.examCode && codes.length === 1) code = codes[0];
    }
    if (qr) {
      if (qr.key) { qrKey = qr.key; code = qr.code; }
      else if (qr.code) { const m = G.matchExamCode(qr.code, codes); if (m) code = m; else info.push(`QR ghi mã đề ${qr.code} nhưng chưa có đáp án cho mã đề này.`); }
      const rc = res.examCode && res.examCode.complete ? read : '';
      if (qr.error) info.push(qr.error);
      if (rc && qr.code && G.matchExamCode(rc, [qr.code]) !== qr.code) info.push(`Mã đề QR (${qr.code}) khác mã đề tô trên phiếu (${rc}) – đã theo QR.`);
    } else if (mode === 'qr') info.push('Không đọc được mã QR trên phiếu.');
    const rec = {
      id: newId(), createdAt: Date.now(), fileName: fileName || '',
      sbd: res.candidateNumber ? res.candidateNumber.value : '',
      sbdOk: !!(res.candidateNumber && res.candidateNumber.complete),
      examCodeRead: read || (qr && qr.code) || '', code: code || '',
      qr: !!qr, qrKey, qrMissing: mode === 'qr' && !qr,
      answers: res.questions.map(q => [q.part, q.q, q.value]),
      info
    };
    gradeRecord(rec);
    state.results.push(rec);
    await Store.saveResult(rec);
    state.session.set(rec.id, {
      clean: await rgbaToBlob(res.warped.rgba, res.warped.w, res.warped.h, 0.9),
      questions: res.questions, w: res.warped.w, h: res.warped.h, candidate: res.candidateNumber, examCode: res.examCode
    });
    await renderRecordImage(rec, res);
    return { ok: true, id: rec.id, fileName };
  }

  async function updateRecord(rec, changes) {
    Object.assign(rec, changes);
    if ('sbd' in changes) rec.sbdOk = /^\d+$/.test(rec.sbd);
    gradeRecord(rec);
    await Store.saveResult(rec);
    await renderRecordImage(rec);
    render();
  }

  async function deleteRecord(id) {
    state.results = state.results.filter(r => r.id !== id);
    state.session.delete(id);
    await Store.deleteResult(id);
    await Img.del(id);
    if (state.current && state.current.id === id) state.current = null;
    state.batch = state.batch.filter(b => b.id !== id);
  }

  async function regradeAll() {
    for (const rec of state.results) {
      gradeRecord(rec);
      Store.saveResult(rec);
      if (state.session.has(rec.id)) await renderRecordImage(rec);
    }
  }

  // ======================================================================= Đáp án

  async function onExcelFile(files) {
    const f = files[0];
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const grids = H.xlsx.readXlsx(bytes);
      const det = H.keys.detectAnswerKeys(grids, { shortMaxLength: shortMaxLength() });
      det.fileName = f.name;
      state.pendingImport = det;
    } catch (e) {
      state.pendingImport = { found: false, fileName: f.name, keys: [], notes: [], issues: [{ severity: 'error', message: e && e.message ? e.message : String(e) }] };
    }
    render();
  }

  async function savePendingImport() {
    const d = state.pendingImport;
    if (!d || !d.keys.length) return;
    const keys = d.keys.filter(k => k.items.length);
    const old = state.keys.map(k => k.code);
    const removed = old.filter(c => !keys.some(k => k.code === c));
    if (removed.length && !(await confirmBox('Thay toàn bộ đáp án?', `File chỉ có ${keys.length} mã đề. Các mã đề không có trong file sẽ bị xóa: ${removed.join(', ')}. Bài đã chấm theo các mã đề đó sẽ chưa có điểm.`, 'Thay bằng file mới', true))) return;
    state.keys = keys;
    state.pendingImport = null;
    await saveConfig();
    await regradeAll();
    render();
    toast(`Đã lưu ${keys.length} mã đề.`);
  }

  async function saveTyped() {
    const t = state.typed;
    const { key, errors } = G.parseTypedKey(t.code, t.p1, t.p2, t.p3);
    if (errors.length) { state.typedErrors = errors; render(); return; }
    const idx = state.keys.findIndex(k => k.code === key.code);
    if (idx >= 0) state.keys[idx] = key; else state.keys.push(key);
    state.keys.sort((a, b) => a.code.localeCompare(b.code, 'vi', { numeric: true }));
    state.typed = { code: '', p1: '', p2: '', p3: '' }; state.typedErrors = null; state.typedOpen = false;
    await saveConfig();
    await regradeAll();
    render();
    toast(`Đã lưu mã đề ${key.code} (${G.keySummary(key)}).`);
  }

  async function deleteKey(code) {
    if (!(await confirmBox(`Xóa mã đề ${code}?`, 'Bài đã chấm theo mã đề này sẽ chưa có điểm cho tới khi nhập lại đáp án.', 'Xóa mã đề', true))) return;
    state.keys = state.keys.filter(k => k.code !== code);
    await saveConfig(); await regradeAll(); render();
  }

  async function deleteAllKeys() {
    if (!(await confirmBox('Xóa tất cả mã đề?', `Xóa ${state.keys.length} mã đề để nhập lại từ đầu. Kết quả đã chấm vẫn giữ nhưng chưa có điểm.`, 'Xóa tất cả', true))) return;
    state.keys = []; await saveConfig(); await regradeAll(); render();
  }

  async function onTemplateFile(files) {
    for (const f of files) {
      try {
        const tpl = H.omr.parseTemplate(await f.text()), json = templateToJson(tpl);
        const dup = state.tplLib.find(t => t.json.code === json.code && t.json.name === json.name);
        const id = dup ? dup.id : newId();
        if (dup) dup.json = json; else state.tplLib.push({ id, json });
        state.template = tpl; state.templateIsDefault = false; state.tplId = id;
        await saveConfig(); render();
        toast(`Đã thêm và dùng mẫu “${tpl.name}”.`);
      } catch (e) { toast(e && e.message ? e.message : 'Không đọc được tệp mẫu phiếu.', 5000); }
    }
  }

  // ======================================================================= Xuất kết quả

  function sortedResults() {
    return state.results.slice().sort((a, b) => (a.sbd || '').localeCompare(b.sbd || '', 'vi', { numeric: true }) || a.createdAt - b.createdAt);
  }
  function questionColumns() {
    const set = new Map();
    for (const k of state.keys) for (const it of k.items) set.set(it.part * 1000 + it.q, `${ROMAN[it.part]}.${it.q}`);
    return [...set.entries()].sort((a, b) => a[0] - b[0]);
  }
  function resultTable() {
    const qcols = questionColumns();
    const head = ['STT', 'Số báo danh', 'Mã đề', 'Điểm/10', 'Điểm thô', 'Tối đa', 'Đúng', 'Đúng một phần', 'Sai', 'Bỏ trống', 'Tô lỗi', 'Ghi chú', 'Thời gian chấm'].concat(qcols.map(c => c[1]));
    const rows = [head];
    sortedResults().forEach((r, i) => {
      const ans = new Map(r.answers.map(a => [a[0] * 1000 + a[1], a[2]]));
      const notes = recordProblems(r).map(p => p.text.replace(/ – .*$/, '')).join('; ');
      const d = new Date(r.createdAt);
      rows.push([i + 1, r.sbd || '', r.code || r.examCodeRead || '', r.graded ? r.score10 : null, r.graded ? r.raw : null, r.graded ? r.max : null,
        r.graded ? r.correct : null, r.graded ? r.partial : null, r.graded ? r.incorrect : null, r.graded ? r.blank : null, r.graded ? r.problems : null,
        notes, `${d.toLocaleDateString('vi-VN')} ${d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}`]
        .concat(qcols.map(c => (ans.get(c[0]) || '').replace(/^_+$/, ''))));
    });
    return rows;
  }

  async function exportXlsx() {
    const rows = resultTable();
    const widths = [6, 13, 9, 9, 9, 8, 7, 9, 6, 9, 8, 40, 17].concat(questionColumns().map(() => 7));
    const bytes = H.xlsx.writeXlsx('Kết quả', rows, widths);
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = `KetQua_ChamThi_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.xlsx`;
    const c = globalThis.claude;
    let dl = null;
    if (c && typeof c.use === 'function') { try { dl = await withTimeout(c.use('downloads'), 4000); } catch { dl = null; } }
    if (dl) {
      try { await dl.save({ filename: name, data: new Blob([bytes]) }); toast('Đã lưu file Excel.'); return; }
      catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('Đang có hộp thoại lưu file – hãy thử lại sau giây lát.'); return; } }
    }
    try {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const a = el('a', { href: url, download: name, style: 'display:none' });
      document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
    } catch {
      toast('Trình duyệt không cho tải file – hãy dùng “Sao chép bảng”.', 4000);
    }
  }

  async function copyTable() {
    const text = resultTable().map(r => r.map(v => (v == null ? '' : typeof v === 'number' ? String(v).replace('.', ',') : String(v).replace(/\t|\n/g, ' '))).join('\t')).join('\n');
    try { await navigator.clipboard.writeText(text); toast('Đã sao chép – dán vào Excel hoặc Google Sheets.'); }
    catch {
      modal((box, close) => {
        const ta = el('textarea', { class: 'input', style: 'min-height:200px;font-size:12px' }); ta.value = text;
        box.append(el('h3', null, 'Sao chép bảng điểm'), el('p', { class: 'muted small' }, 'Chạm giữ để chọn tất cả rồi sao chép, sau đó dán vào Excel.'), ta,
          el('div', { class: 'row mt' }, el('button', { class: 'btn block', onclick: close }, 'Đóng')));
        setTimeout(() => { ta.focus(); ta.select(); }, 50);
      });
    }
  }

  /** Camera quét liên tục các mã QR đáp án (mỗi QR một mã đề); quét xong mã này tự chờ mã tiếp theo. */
  async function startKeyScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraErrorModal(null); return; }
    const video = el('video', { autoplay: true, muted: true, playsinline: true }); video.muted = true;
    const hint = el('div', { class: 'hint' }, 'Đưa mã QR đáp án vào camera');
    const count = el('span', { class: 'count' }, 'Đã nạp 0');
    const closeBtn = el('button', { class: 'x', 'aria-label': 'Đóng' }, '✕');
    const doneBtn = el('button', { class: 'btn primary', style: 'min-width:120px' }, 'Xong');
    const root = el('div', { class: 'live' }, video,
      el('div', { class: 'bar' }, closeBtn, el('div', { class: 'title' }, el('b', null, 'Quét QR đáp án'), el('span', null, 'Quét lần lượt từng mã đề')), count),
      el('div', { class: 'msg' }, hint), el('div', { class: 'controls' }, doneBtn));
    document.body.append(root);
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } }); }
    catch (e) { root.remove(); cameraErrorModal(e); return; }
    video.srcObject = stream; try { await video.play(); } catch { /* đã autoplay */ }
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    const seen = new Set(), loaded = []; let closed = false, timer = 0, busy = false;
    const setHint = (t, k) => { hint.textContent = t; hint.className = 'hint' + (k ? ' ' + k : ''); };
    async function tick() {
      if (closed) return;
      if (!busy && video.readyState >= 2 && video.videoWidth) {
        const sc = Math.min(1, 1000 / Math.max(video.videoWidth, video.videoHeight));
        cv.width = Math.round(video.videoWidth * sc); cv.height = Math.round(video.videoHeight * sc);
        cx.drawImage(video, 0, 0, cv.width, cv.height);
        let text = null;
        try { text = H.qr.scan({ rgba: cx.getImageData(0, 0, cv.width, cv.height).data, w: cv.width, h: cv.height }); } catch { text = null; }
        if (text && !seen.has(text)) {
          seen.add(text); busy = true;
          const p = H.qr.decode(text);
          if (p && p.key) {
            await upsertKey(p.key); loaded.push(p.key.code);
            count.textContent = `Đã nạp ${loaded.length}`;
            setHint(`✓ Mã đề ${p.key.code} (${G.keySummary(p.key)}) – quét mã tiếp theo hoặc bấm Xong`, 'ok');
            if (navigator.vibrate) try { navigator.vibrate(60); } catch { /* bỏ qua */ }
          } else if (p && p.code) setHint(`QR chỉ ghi mã đề ${p.code}, không có đáp án`, 'bad');
          else setHint(p && p.error ? p.error : 'QR này không phải QR đáp án của phần mềm', 'bad');
          busy = false;
        }
      }
      timer = setTimeout(tick, 150);
    }
    function finish() {
      if (closed) return; closed = true; clearTimeout(timer);
      for (const t of stream.getTracks()) t.stop();
      root.remove(); render();
      if (loaded.length) toast(`Đã nạp ${loaded.length} mã đề: ${loaded.join(', ')}.`, 4000);
    }
    closeBtn.addEventListener('click', finish); doneBtn.addEventListener('click', finish);
    tick();
  }

  function drawTemplate(tpl, W) {
    const Hh = Math.round(W * tpl.pageHeightMm / tpl.pageWidthMm), map = H.omr.buildMap(tpl, W, Hh);
    const c = document.createElement('canvas'); c.width = W; c.height = Hh;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, Hh);
    x.fillStyle = '#111'; for (const a of map.anchors) x.fillRect(a.x, a.y, a.w, a.h);
    x.font = `${Math.max(9, Math.round(W / 55))}px sans-serif`;
    for (const rg of map.regions) {
      const r = rg.region.rect;
      x.strokeStyle = '#D81B60'; x.lineWidth = 1; x.strokeRect(r.x * W, r.y * Hh, r.width * W, r.height * Hh);
      x.fillStyle = '#D81B60'; x.fillText(rg.region.name, r.x * W, r.y * Hh - 3);
      x.strokeStyle = '#555';
      for (const g of rg.groups) for (const cl of g.cells) { x.beginPath(); x.arc(cl.x, cl.y, cl.r, 0, 7); x.stroke(); }
    }
    return c;
  }

  // ---- Đọc QR trên phiếu
  function readQr(res, orig) {

  // ======================================================================= Camera tự bắt góc & tự chụp

  function inFrame() { try { return window.self !== window.top; } catch { return true; } }
  function cameraPolicyBlocked() {
    try {
      const fp = document.permissionsPolicy || document.featurePolicy;
      return !!(fp && typeof fp.allowsFeature === 'function' && !fp.allowsFeature('camera'));
    } catch { return false; }
  }
  const liveAvailable = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false && !cameraPolicyBlocked();

  function cameraErrorText(e) {
    const name = e && e.name;
    if (!navigator.mediaDevices || window.isSecureContext === false) return 'Camera trực tiếp cần mở trang bằng địa chỉ https.';
    if (name === 'NotAllowedError' || name === 'SecurityError')
      return inFrame() || cameraPolicyBlocked()
        ? 'Trang đang mở bên trong Claude nên không được mở camera trực tiếp. Dùng nút “Chụp phiếu”, hoặc mở bản web riêng (https) để dùng camera tự bắt góc.'
        : 'Camera đang bị chặn – hãy cho phép camera cho trang này trong cài đặt trình duyệt rồi thử lại.';
    if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'Không tìm thấy camera trên thiết bị này.';
    if (name === 'NotReadableError' || name === 'AbortError') return 'Camera đang được ứng dụng khác dùng – đóng ứng dụng đó rồi thử lại.';
    return 'Không mở được camera: ' + (e && e.message ? e.message : e);
  }

  /** Bố cục khung ngắm: 4 ô vuông đặt đúng vị trí 4 neo góc của mẫu phiếu, khung bám hình chữ nhật của 4 neo. */
  function liveLayout(cw, ch, extraBottom) {
    const tpl = state.template, pw = tpl.pageWidthMm, ph = tpl.pageHeightMm;
    const corners = H.omr.cornerAnchors(tpl);
    const xs = corners.map(c => c.x * pw), ys = corners.map(c => c.y * ph);
    const aw = Math.max(...corners.map(c => c.w * pw)), ah = Math.max(...corners.map(c => c.h * ph));
    const bx0 = Math.min(...xs) - aw * 1.3, bx1 = Math.max(...xs) + aw * 1.3, by0 = Math.min(...ys) - ah * 1.3, by1 = Math.max(...ys) + ah * 1.3;
    // Dọc: thanh trên + gợi ý & nút chụp ở dưới. Ngang: nút chụp thành cột bên phải.
    const land = cw > ch;
    const ins = land ? { top: 58, bottom: 52, left: 8, right: 108 } : { top: 64, bottom: 196 + (extraBottom || 0), left: 12, right: 12 };
    const availW = Math.max(80, cw - ins.left - ins.right), availH = Math.max(80, ch - ins.top - ins.bottom);
    const k = Math.min(availW / (bx1 - bx0), availH / (by1 - by0));
    const fw = (bx1 - bx0) * k, fh = (by1 - by0) * k;
    const fx = ins.left + (availW - fw) / 2, fy = ins.top + (availH - fh) / 2;
    const size = Math.max(42, Math.min(96, Math.max(aw, ah) * k * 2.6));
    return {
      frame: { x: fx, y: fy, w: fw, h: fh }, size,
      guides: corners.map(c => ({ x: fx + (c.x * pw - bx0) * k, y: fy + (c.y * ph - by0) * k })),
      wide: (bx1 - bx0) > (by1 - by0) * 1.25
    };
  }

  async function startLive() {
    if (!canGrade()) { toast('Hãy nhập đáp án (mã đề) trước khi chấm.'); switchTab('keys'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraErrorModal(null); return; }
    const video = el('video', { autoplay: true, muted: true, playsinline: true });
    video.muted = true;
    const canvas = el('canvas');
    const ctx = canvas.getContext('2d');
    const flash = el('div', { class: 'flash' });
    const hint = el('div', { class: 'hint' }, 'Đang mở camera…');
    const count = el('span', { class: 'count' }, 'Đã chấm 0');
    const resBox = el('button', { class: 'res hidden' });
    const rotTip = el('div', { class: 'rot hidden' }, 'Xoay ngang điện thoại để phiếu to và rõ hơn');
    const torchBtn = el('button', { class: 'side hidden', 'aria-label': 'Bật/tắt đèn' }, icon('sun'));
    const ring = el('span', { class: 'ring' });
    const shutter = el('button', { class: 'shutter', 'aria-label': 'Chụp ngay' }, ring);
    const doneBtn = el('button', { class: 'side', 'aria-label': 'Xong' }, el('span', { class: 'done' }, 'Xong'));
    const closeBtn = el('button', { class: 'x', 'aria-label': 'Đóng camera' }, '✕');
    const title = el('div', { class: 'title' }, el('b', null, 'Camera tự chụp'), el('span', null, state.template.name));
    const bottomBox = el('div', { class: 'msg' }, rotTip, hint);
    // Kết quả bài vừa chấm hiện ở thanh trên cùng để khung ngắm không bị dời chỗ.
    const root = el('div', { class: 'live' }, video, canvas, flash,
      el('div', { class: 'bar' }, closeBtn, title, resBox, count),
      bottomBox, el('div', { class: 'controls' }, torchBtn, shutter, doneBtn));
    document.body.append(root);

    let stream;
    try {
      // ?cam=RỘNGxCAO chỉ dùng khi kiểm thử với camera giả lập (trong Claude không có tham số này).
      const forced = /^(\d{3,4})x(\d{3,4})$/.exec(new URLSearchParams(location.search).get('cam') || '');
      const size = forced ? { width: { exact: +forced[1] }, height: { exact: +forced[2] } } : { width: { ideal: 2560 }, height: { ideal: 1440 } };
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: Object.assign({ facingMode: { ideal: 'environment' } }, size) });
    } catch (e) {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment' } }); }
      catch (e2) { root.remove(); cameraErrorModal(e2 || e); return; }
    }
    video.srcObject = stream;
    try { await video.play(); } catch { /* đã autoplay */ }
    const track = stream.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    let torch = false;
    if (caps.torch) {
      torchBtn.classList.remove('hidden');
      torchBtn.addEventListener('click', async () => {
        torch = !torch;
        try { await track.applyConstraints({ advanced: [{ torch }] }); torchBtn.classList.toggle('on', torch); } catch { torch = !torch; }
      });
    }
    let lock = null;
    try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch { lock = null; }

    const items = [];
    const small = document.createElement('canvas');
    const sctx = small.getContext('2d', { willReadFrequently: true });
    const cfg = state.settings, prof = SENS[cfg.sens] || SENS.mid, ratio0 = tplRatio();
    let cooldownUntil = 0, curSharp = 0;
    let closed = false, busy = false, timer = 0, history = [], waitClear = false, clearSince = 0, lastPts = null, curPts = null;
    const setHint = (text, kind) => { hint.textContent = text; hint.className = 'hint' + (kind ? ' ' + kind : ''); };
    const progress = v => { ring.style.transform = `scale(${0.35 + 0.65 * v})`; ring.classList.toggle('full', v >= 1); };
    const moved = (a, b) => Math.max(...a.map((p, i) => Math.hypot(p[0] - b[i][0], p[1] - b[i][1])));

    function draw(lay, lit, corners) {
      const dpr = window.devicePixelRatio || 1, cw = root.clientWidth, ch = root.clientHeight;
      if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) { canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      const f = lay.frame;
      ctx.setLineDash([7, 7]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.strokeRect(f.x, f.y, f.w, f.h);
      ctx.setLineDash([]);
      const half = lay.size / 2;
      lay.guides.forEach((g, i) => {
        const on = lit[i];
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(g.x - half, g.y - half, lay.size, lay.size, 10); else ctx.rect(g.x - half, g.y - half, lay.size, lay.size);
        ctx.fillStyle = on ? 'rgba(46,160,67,.30)' : 'rgba(0,0,0,.18)'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = on ? '#4ADE80' : '#FFFFFF'; ctx.stroke();
        const q = lay.size * 0.3;
        ctx.fillStyle = on ? '#4ADE80' : 'rgba(255,255,255,.75)';
        ctx.fillRect(g.x - q / 2, g.y - q / 2, q, q);
      });
      if (corners) {
        ctx.beginPath();
        corners.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
        ctx.closePath(); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(74,222,128,.95)'; ctx.stroke();
        ctx.fillStyle = '#4ADE80';
        for (const p of corners) ctx.fillRect(p[0] - 5, p[1] - 5, 10, 10);
      }
    }

    function showResult(rec) {
      const probs = recordProblems(rec);
      resBox.replaceChildren(
        el('div', { class: 'score-s' }, rec.graded ? fmt(rec.score10) : '—'),
        el('div', { class: 'grow' },
          el('b', null, `SBD ${rec.sbd || '?'} · Mã đề ${rec.code || rec.examCodeRead || '?'}`),
          probs.length ? el('div', { class: 'warnline' }, '⚠ ' + probs[0].text.replace(/ – .*$/, ''))
            : el('div', { class: 'okline' }, rec.graded ? `Đúng ${rec.correct} · Sai ${rec.incorrect} · Xem ›` : 'Chưa chấm – chạm để chọn mã đề')));
      resBox.className = 'res' + (probs.length ? ' warn' : '');
      title.classList.add('hidden');
      resBox.onclick = () => finish(rec.id);
    }

    async function capture(corners) {
      if (busy) return;
      busy = true; history = []; progress(1);
      flash.classList.add('on'); setTimeout(() => flash.classList.remove('on'), 180);
      if (navigator.vibrate) try { navigator.vibrate(40); } catch { /* bỏ qua */ }
      setHint('Đang chấm…', 'ok');
      const vw = video.videoWidth, vh = video.videoHeight, sc = Math.min(1, 2000 / Math.max(vw, vh));
      const c = document.createElement('canvas'); c.width = Math.round(vw * sc); c.height = Math.round(vh * sc);
      const cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(video, 0, 0, c.width, c.height);
      const img = { rgba: cx.getImageData(0, 0, c.width, c.height).data, w: c.width, h: c.height };
      await nextFrame();
      let res;
      try { res = H.omr.recognize(img, state.template); } catch (e) { res = { ok: false, error: e && e.message }; }
      if (closed) return;
      if (!res.ok) {
        setHint('Chưa đọc được phiếu – giữ thẳng máy, đủ sáng rồi thử lại', 'bad');
        progress(0); busy = false; waitClear = false;
        return;
      }
      // Cùng một phiếu vừa chấm (camera bắt lại sau khi phiếu bị xê dịch): bỏ qua, không tạo bài trùng.
      const prev = items.length ? state.results.find(r => r.id === items[items.length - 1].id) : null;
      const sig = res.questions.map(q => q.value).join('|');
      if (prev && prev._sig === sig && prev.sbd === (res.candidateNumber ? res.candidateNumber.value : '')) {
        setHint('Phiếu này vừa chấm rồi – đưa phiếu tiếp theo vào khung', 'ok');
        waitClear = true; clearSince = 0; lastPts = corners; progress(0); busy = false;
        return;
      }
      let qr;
      if (cfg.keyMode === 'qr') {
        qr = readQr(res, img);
        if (!qr) { setHint('Chưa đọc được mã QR – giữ yên, đủ sáng, thấy rõ QR', 'bad'); progress(0); busy = false; waitClear = false; cooldownUntil = performance.now() + 800; return; }
      }
      const item = await finishRecognition(res, `Camera ${new Date().toLocaleTimeString('vi-VN')}`, img, qr);
      const recNew = state.results.find(r => r.id === item.id);
      if (recNew) Object.defineProperty(recNew, '_sig', { value: sig, enumerable: false, writable: true });
      items.push(item);
      count.textContent = `Đã chấm ${items.length}`;
      const rec = state.results.find(r => r.id === item.id);
      if (rec) showResult(rec);
      waitClear = true; clearSince = 0; lastPts = corners;
      setHint(rec && rec.qr ? 'Đã chấm (QR ✓) – đưa phiếu tiếp theo vào khung' : 'Đưa phiếu tiếp theo vào khung', 'ok');
      cooldownUntil = performance.now() + cfg.cooldownMs;
      progress(0);
      busy = false;
    }

    function onDetect(r, vw, vh, ds) {
      const cw = root.clientWidth, ch = root.clientHeight;
      // Chừa chỗ cố định phía dưới (gợi ý 2 dòng + nút chụp) để khung ngắm đứng yên.
      const showRot = liveLayout(cw, ch, 0).wide && ch > cw * 1.15;
      rotTip.classList.toggle('hidden', !showRot);
      const lay = liveLayout(cw, ch, showRot ? 34 : 0);
      const s = Math.max(cw / vw, ch / vh), ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
      const sc = p => [ox + p.x / ds * s, oy + p.y / ds * s];
      const cands = r.candidates.map(sc);
      const corners = r.ok ? r.corners.map(sc) : null;
      const reach = lay.size * 0.95;
      const inside = (g, p) => Math.abs(p[0] - g.x) <= reach && Math.abs(p[1] - g.y) <= reach;
      const lit = lay.guides.map(g => (corners || cands).some(p => inside(g, p)));
      curPts = corners;
      draw(lay, lit, corners);
      if (busy) return;
      const now = performance.now();
      if (waitClear) {
        if (!corners) { if (!clearSince) clearSince = now; if (now - clearSince > 600) waitClear = false; }
        else { clearSince = 0; if (lastPts && moved(corners, lastPts) > 0.12 * Math.min(cw, ch)) waitClear = false; }
        if (waitClear) { history = []; return; }
      }
      if (!corners) {
        history = []; progress(0);
        const n = lit.filter(Boolean).length;
        setHint(n ? `Thấy ${n}/4 góc – đưa cả 4 ô vuông đen vào 4 khung` : 'Đưa 4 ô vuông đen ở góc phiếu vào 4 khung vuông', '');
        return;
      }
      if (!lit.every(Boolean)) { history = []; progress(0); setHint('Căn phiếu cho 4 góc nằm trong 4 khung vuông', ''); return; }
      const v = checkQuad(corners, r, cw, ch, prof, ratio0);
      if (!v.ok) { history = []; progress(0); setHint(v.why, ''); return; }
      const pct = Math.round(v.conf * 100);
      if (v.conf < prof.conf) { history = []; progress(0); setHint(`Độ tin cậy ${pct}% – giữ máy thẳng, đủ sáng`, ''); return; }
      history.push({ t: now, pts: corners, s: curSharp });
      history = history.filter(x => now - x.t < 1500);
      if (history.some(x => moved(x.pts, corners) > prof.move * Math.min(cw, ch))) history = [{ t: now, pts: corners, s: curSharp }];
      const span = now - history[0].t;
      progress(Math.min(1, span / cfg.stableMs));
      if (!cfg.auto) { setHint(`Phiếu hợp lệ (${pct}%) – bấm nút chụp`, 'ok'); return; }
      if (now < cooldownUntil) { setHint('Đã chấm – chờ giây lát…', 'ok'); return; }
      setHint(`Giữ yên máy… (tin cậy ${pct}%)`, 'ok');
      const best = Math.max(...history.map(x => x.s));
      if (span >= cfg.stableMs && history.length >= 3 && curSharp >= best * 0.75) capture(corners);
    }

    function tick() {
      if (closed) return;
      if (!busy && video.readyState >= 2 && video.videoWidth) {
        const vw = video.videoWidth, vh = video.videoHeight, ds = Math.min(1, 720 / Math.max(vw, vh));
        const w = Math.round(vw * ds), h = Math.round(vh * ds);
        if (small.width !== w || small.height !== h) { small.width = w; small.height = h; }
        sctx.drawImage(video, 0, 0, w, h);
        let r;
        try { const data = sctx.getImageData(0, 0, w, h).data; curSharp = sharpness(data, w, h); r = H.omr.detectLive({ rgba: data, w, h }, state.template); } catch { r = { ok: false, candidates: [] }; }
        onDetect(r, vw, vh, ds);
      }
      timer = setTimeout(tick, 70);
    }

    function finish(showId) {
      if (closed) return;
      closed = true;
      clearTimeout(timer);
      for (const t of stream.getTracks()) t.stop();
      if (lock) lock.release().catch(() => {});
      document.removeEventListener('keydown', onKey);
      root.remove();
      if (items.length) {
        state.batch = items.length > 1 ? items.slice() : [];
        state.current = showId ? items.find(i => i.id === showId) || items[items.length - 1] : items[items.length - 1];
      }
      state.tab = 'scan';
      render();
      window.scrollTo(0, 0);
      if (items.length) toast(`Đã chấm ${items.length} bài bằng camera.`);
    }
    const onKey = e => { if (e.key === 'Escape') finish(); };
    document.addEventListener('keydown', onKey);
    closeBtn.addEventListener('click', () => finish());
    doneBtn.addEventListener('click', () => finish());
    shutter.addEventListener('click', () => { if (!busy) capture(curPts || [[0, 0], [0, 0], [0, 0], [0, 0]]); });
    setHint('Đưa 4 ô vuông đen ở góc phiếu vào 4 khung vuông', '');
    tick();
  }

  async function syncFromCloud(first) {
    try {
      const { config, results } = await Store.loadCloud();
      if (config) applyConfig(config);
      else if (first && (state.keys.length || !state.templateIsDefault)) await Store.saveConfig(configObject()); // chuyển dữ liệu trên máy lên tài khoản
      const cloudIds = new Set(results.map(r => r.id));
      // Lần đầu: đưa các bài chỉ có trên máy lên tài khoản. Các lần sau: giữ bài vừa chấm mà tài khoản chưa kịp ghi.
      for (const r of state.results) {
        if (cloudIds.has(r.id)) continue;
        if (first) { results.push(r); Store.saveResult(r); } else if (Date.now() - r.createdAt < 120000) results.push(r);
      }
      state.results = results.filter(r => r && r.id && Array.isArray(r.answers));
      lsSet(LS_RESULTS, state.results);
    } catch {
      if (first) { Store.mode = 'local'; toast('Không kết nối được bộ nhớ tài khoản – đang lưu trên máy này.', 4000); }
    }
  }

  async function start() {
    shell();
    applyConfig(lsGet(LS_CONFIG, null));
    state.results = lsGet(LS_RESULTS, []).filter(r => r && r.id && Array.isArray(r.answers));
    if (state.keys.length) state.tab = 'scan';
    render();
    if (await Store.connect()) {
      await syncFromCloud(true);
      if (state.keys.length && state.tab === 'keys' && !state.pendingImport) state.tab = 'scan';
      render();
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState !== 'visible' || state.busy || Store.mode !== 'cloud') return;
        await syncFromCloud(false);
        render();
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
</body>
</html>
